<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boucle de la forme</title>
<!--
  A 14 second motion loop for Instagram stories and WhatsApp statuses
  (1080x1920, 60 fps): one shape that goes through the gestures of a shared
  reading, from « Réserver » to the siyoum, and comes back to its first frame.

  Render contract:
  - window.renderAt(t) draws frame t (seconds) and is a pure function of t:
    no Math.random, no clock, the folded time drives everything.
  - Frame n is renderAt(n / 60); motion blur averages 4 samples per frame.
  - Every property is a sum of closed-form spring step responses, including
    the steps of the previous cycle, so the loop seam is exact.

  Storyboard and render commands: promo/loop/README.md.
  Fonts: Playfair Display and Manrope (SIL Open Font License 1.1, from
  Fontsource), embedded so the file needs no network.
-->
<style>
  :root {
    --stone: #F4F1EA;
    --ink: #111111;
    --accent: #FF5B1F;
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--stone);
    color: var(--ink);
    font: 700 14px/1.5 Manrope, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 16px;
    box-sizing: border-box;
  }
  canvas {
    height: calc(100vh - 112px);
    max-width: 100%;
    aspect-ratio: 9 / 16;
    outline: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
  }
  .controls { display: flex; align-items: center; gap: 16px; width: min(100%, 560px); }
  .controls input[type="range"] { flex: 1; accent-color: var(--accent); }
  button {
    font: inherit;
    border: 0;
    border-radius: 999px;
    padding: 8px 16px;
    background: var(--ink);
    color: var(--stone);
    cursor: pointer;
  }
  output { font-variant-numeric: tabular-nums; min-width: 128px; text-align: right; }
  label { display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body>
<canvas id="frame" width="1080" height="1920"></canvas>
<div class="controls">
  <button id="play" type="button">▶ Lire</button>
  <input id="scrub" type="range" min="0" max="839" step="1" value="0" aria-label="Image">
  <output id="clock">0 / 839</output>
  <label><input id="blur" type="checkbox" checked> Flou</label>
</div>
<script>
"use strict";

// ---------------------------------------------------------------- constants

const W = 1080, H = 1920, FPS = 60, D = 14;
const STONE = "#F4F1EA", INK = "#111111", ACCENT = "#FF5B1F";
const CX = 540, CY = 896;          // centre of the safe zone (y from 256 to 1536)
const DISPLAY = '"Playfair Display", serif';
const SANS = '"Manrope", sans-serif';
const FADE = 0.15;                 // content change: 12 px blur and fade
const BLUR = 12;
const STAGGER = 0.04;              // between child elements
const SUBSAMPLES = 4;              // motion blur
const SHUTTER = 0.5;               // fraction of the frame the samples span

// ------------------------------------------------------------------ springs

/** Closed-form step response of a damped spring, settling to 2 % in `settle` s. */
function spring(zeta, settle) {
  if (zeta >= 1) {
    // Critical damping: (1 + wx) e^-wx = 0.02 gives wx = 5.834.
    const w = 5.834 / settle;
    return (x) => (x <= 0 ? 0 : 1 - (1 + w * x) * Math.exp(-w * x));
  }
  const w = 4 / (zeta * settle);
  const wd = w * Math.sqrt(1 - zeta * zeta);
  const k = (zeta * w) / wd;
  return (x) => (x <= 0 ? 0 : 1 - Math.exp(-zeta * w * x) * (Math.cos(wd * x) + k * Math.sin(wd * x)));
}

const SHAPE = spring(0.72, 0.35);
const CAMERA = spring(1, 0.6);
const RAMP = (x) => Math.min(1, Math.max(0, x / FADE));

/**
 * A property driven by keys [time, value]: each key starts a step from the
 * previous value, and the steps of the previous cycle are summed too, so the
 * value at 14 s is the value at 0 s, position and speed alike. The value
 * before the first key is the last one.
 */
function track(keys, response = SHAPE) {
  const last = keys[keys.length - 1][1];
  const steps = keys.map(([t, v], i) => [t, v - (i ? keys[i - 1][1] : last)]);
  return (tau) => {
    let v = last;
    for (const [t, d] of steps) if (d) v += d * (response(tau - t) + response(tau + D - t));
    return v;
  };
}

/** Visibility of a child: 0 or 1 at each key, reached in 0.15 s. */
const visible = (keys) => track(keys, RAMP);

// ----------------------------------------------------------------- timeline

// Every start sits on the 0.5 s grid (child staggers aside).
const T = {
  press: 0.5, loader: 1.0, check: 2.0, player: 3.0, play: 3.5, slider: 4.5,
  drag: 5.0, toggle: 6.0, toggleOn: 7.0, chart: 8.0, toast: 9.5,
  back: 11.5, recolor: 12.0, base: 13.0, tagline: 12.5,
};

// The shape. Sizes in pixels of the 1080x1920 frame, on the 8 px grid.
const shapeW = track([[T.loader, 152], [T.player, 896], [T.toggle, 280], [T.chart, 896], [T.toast, 544], [T.back, 488]]);
const shapeH = track([[T.player, 256], [T.slider, 64], [T.toggle, 152], [T.chart, 640], [T.toast, 128], [T.back, 152]]);
const shapeR = track([[T.player, 24], [T.slider, 32], [T.toggle, 76], [T.chart, 24], [T.back, 76]]);
const shapeY = track([[T.toast, CY + 352], [T.back, CY]]);
const shapeScale = track([[T.press, 0.94], [T.loader, 1]]);
const zoom = track([[T.chart, 0.96], [T.toast, 1]], CAMERA);

// The colour changes are drawn by the shape, never blended: the base colour
// only switches while a patch fully hides it.
const baseColor = (tau) => (tau < 2.5 || tau >= T.base ? ACCENT : INK);

// The black disk that fills the loader (then hides, black on black).
const inkDisk = track([[T.check, 88], [T.player, 0]]);

// Seeded waveform (mulberry32), heights on the 8 px grid.
function mulberry32(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(23);
const WAVE_LEFT = -208, WAVE_PITCH = 24, WAVE_BAR = 8, WAVE_Y = 56;
const WAVE = Array.from({ length: 26 }, () => 8 * (1 + Math.floor(rand() * 8)));
const WAVE_WIDTH = (WAVE.length - 1) * WAVE_PITCH + WAVE_BAR;

// The slider knob, at 35 % then 80 % of the track. The played part of the
// waveform ends exactly where the slider fill will end, so the accent edge
// does not jump when the player flattens into the slider.
const KNOB_35 = -128, KNOB_80 = 248, KNOB_REACH = 32;
const PLAYED = (KNOB_35 + KNOB_REACH - WAVE_LEFT) / WAVE_WIDTH;

// The wall of Mon parcours: columns of stones, the last one ends on today.
const STONE_W = 80, STONE_H = 48, STONE_GAP_X = 32, STONE_PITCH = 64;
const WALL = [2, 3, 4, 3, 5, 6, 7];
const WALL_LEFT = -((WALL.length * STONE_W + (WALL.length - 1) * STONE_GAP_X) / 2);
const WALL_BOTTOM = 216;
const stoneRect = (col, row) => {
  const x0 = WALL_LEFT + col * (STONE_W + STONE_GAP_X);
  const y1 = WALL_BOTTOM - row * STONE_PITCH;
  return [x0, x0 + STONE_W, y1 - STONE_H, y1];
};
const stoneStart = (col, row) => T.chart + 2 * STAGGER + (col + row) * STAGGER;
const TODAY = stoneRect(WALL.length - 1, WALL[WALL.length - 1] - 1);
const TODAY_START = stoneStart(WALL.length - 1, WALL[WALL.length - 1] - 1);

// The accent patch, relative to the shape centre: it covers the button, hides
// in the check, waits flat on the played waveform, becomes the slider fill,
// the lit toggle, today's stone (laid last), the toast's dot and finally the
// whole button again. A patch of zero height is not drawn, so it can travel
// unseen.
const patchX0 = track([[T.check, 0], [T.player, WAVE_LEFT], [T.slider, -448], [T.toggle, -116], [T.toggleOn, -148], [T.chart, TODAY[0]], [T.toast, -240], [T.back, -212], [T.recolor, -264]]);
const patchX1 = track([[T.check, 0], [T.player, KNOB_35 + KNOB_REACH], [T.drag, KNOB_80 + KNOB_REACH], [T.toggle, -12], [T.toggleOn, 148], [T.chart, TODAY[1]], [T.toast, -176], [T.back, -164], [T.recolor, 264]]);
const patchY0 = track([[T.check, 0], [T.player, WAVE_Y], [T.slider, -32], [T.toggle, -52], [T.toggleOn, -84], [T.chart, TODAY[3]], [TODAY_START, TODAY[2]], [T.toast, -32], [T.back, -24], [T.recolor, -96]]);
const patchY1 = track([[T.check, 0], [T.player, WAVE_Y], [T.slider, 32], [T.toggle, 52], [T.toggleOn, 84], [T.chart, TODAY[3]], [T.toast, 32], [T.back, 24], [T.recolor, 96]]);
const patchR = track([[T.slider, 32], [T.toggle, 52], [T.toggleOn, 84], [T.chart, 8], [T.toast, 32], [T.back, 24], [T.recolor, 96]]);

// The knob of the slider, then of the toggle (the patch under it is 4 px
// smaller, so no accent rim shows around it).
const knobX = track([[T.slider, KNOB_35], [T.drag, KNOB_80], [T.toggle, -64], [T.toggleOn, 64], [T.toast, KNOB_35]]);
const knobR = track([[T.toggle, 56], [T.toast, 20]]);

// Children, each with its visibility.
const vLabel = visible([[T.loader, 0], [T.back, 1]]);
const vArc = visible([[T.loader + STAGGER, 1], [T.check, 0]]);
const vCheck = visible([[T.check + STAGGER, 1], [T.player, 0]]);
const checkDraw = track([[T.check + STAGGER, 1], [T.play, 0]]);
const vPlayDisk = visible([[T.player, 1], [T.slider, 0]]);
const vPlayIcon = visible([[T.player, 1], [T.play, 0]]);
const vPauseIcon = visible([[T.play, 1], [T.slider, 0]]);
const vTitle = visible([[T.player + STAGGER, 1], [T.slider, 0]]);
const vWave = visible([[T.player + 2 * STAGGER, 1], [T.slider, 0]]);
const vKnob = visible([[T.slider, 1], [T.chart, 0]]);
const vBell = visible([[T.toggle + STAGGER, 1], [T.chart, 0]]);
const vStones = visible([[T.chart, 1], [T.toast, 0]]);
const vToastCheck = visible([[T.toast + STAGGER, 1], [T.back, 0]]);
const vToastText = visible([[T.toast + 2 * STAGGER, 1], [T.back, 0]]);
const vTagline = visible([[0.5, 0], [T.tagline, 1]]);

// Playback progress, linear like a real player.
const progress = (tau) => PLAYED * Math.min(1, Math.max(0, tau - T.play));

// The wall grows stone by stone, 40 ms apart along the diagonal, and settles
// back down with the card when it becomes the toast.
const stoneGrowth = [];
WALL.forEach((count, col) => {
  for (let row = 0; row < count; row++) {
    if (col === WALL.length - 1 && row === count - 1) continue;   // today is the patch
    stoneGrowth.push({ rect: stoneRect(col, row), grow: track([[stoneStart(col, row), 1], [T.toast, 0]]) });
  }
});

// ------------------------------------------------------------------ drawing

const canvas = document.getElementById("frame");
const ctx = canvas.getContext("2d", { willReadFrequently: true });
const layer = document.createElement("canvas");
layer.width = W; layer.height = H;
const lx = layer.getContext("2d");
const sample = document.createElement("canvas");
sample.width = W; sample.height = H;
const sx = sample.getContext("2d", { willReadFrequently: true });

let capSans56 = 40, capSans48 = 35;          // cap heights, measured once the fonts are in

function roundRect(c, x0, y0, x1, y1, r) {
  const w = x1 - x0, h = y1 - y0;
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath();
  c.roundRect(x0, y0, w, h, r);
}

/** Draws a child with its visibility: 12 px of blur and the fade. */
function child(c, v, draw) {
  if (v <= 0.001) return;
  c.save();
  c.globalAlpha *= v;
  if (v < 0.999) c.filter = `blur(${(BLUR * (1 - v)).toFixed(3)}px)`;
  draw();
  c.restore();
}

function checkPath(c, points, amount) {
  // Draws the first `amount` (0 to 1) of a polyline, by length.
  const lengths = [];
  let total = 0;
  for (let i = 1; i < points.length; i++) {
    const l = Math.hypot(points[i][0] - points[i - 1][0], points[i][1] - points[i - 1][1]);
    lengths.push(l); total += l;
  }
  let left = Math.min(1, Math.max(0, amount)) * total;
  if (left <= 0) return;
  c.beginPath();
  c.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length && left > 0; i++) {
    const f = Math.min(1, left / lengths[i - 1]);
    c.lineTo(points[i - 1][0] + (points[i][0] - points[i - 1][0]) * f, points[i - 1][1] + (points[i][1] - points[i - 1][1]) * f);
    left -= lengths[i - 1];
  }
  c.stroke();
}

function bell(c, x, scale) {
  c.save();
  c.translate(x, 0);
  c.scale(scale, scale);
  c.fillStyle = INK;
  c.beginPath();
  c.moveTo(-12, 8);
  c.lineTo(-12, -2);
  c.arc(0, -2, 12, Math.PI, 0);
  c.lineTo(12, 8);
  c.lineTo(16, 12);
  c.lineTo(-16, 12);
  c.closePath();
  c.fill();
  c.beginPath(); c.arc(0, 17, 4, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(0, -16, 3, 0, Math.PI * 2); c.fill();
  c.restore();
}

/** One sample of the image at folded time tau, into context c. */
function drawSample(c, tau) {
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalCompositeOperation = "source-over";
  c.globalAlpha = 1;
  c.filter = "none";
  c.fillStyle = STONE;
  c.fillRect(0, 0, W, H);

  // The shape and everything inside it, on its own layer: source-atop keeps
  // the shape's edge as the only mask, so a patch never leaves a fringe.
  lx.setTransform(1, 0, 0, 1, 0, 0);
  lx.globalCompositeOperation = "source-over";
  lx.globalAlpha = 1;
  lx.filter = "none";
  lx.clearRect(0, 0, W, H);

  const z = zoom(tau), s = shapeScale(tau);
  const w = shapeW(tau), h = shapeH(tau), r = shapeR(tau);
  const cy = CY + (shapeY(tau) - CY) * z;
  lx.setTransform(z * s, 0, 0, z * s, CX, cy);

  roundRect(lx, -w / 2, -h / 2, w / 2, h / 2, r);
  lx.fillStyle = baseColor(tau);
  lx.fill();
  lx.globalCompositeOperation = "source-atop";

  // Accent patch.
  const px0 = patchX0(tau), px1 = patchX1(tau), py0 = patchY0(tau), py1 = patchY1(tau);
  if (px1 - px0 > 0.25 && py1 - py0 > 0.25) {
    roundRect(lx, px0, py0, px1, py1, patchR(tau));
    lx.fillStyle = ACCENT;
    lx.fill();
  }
  // Ink disk of the check.
  const ink = inkDisk(tau);
  if (ink > 0.25) {
    lx.beginPath(); lx.arc(0, 0, ink, 0, Math.PI * 2);
    lx.fillStyle = INK; lx.fill();
  }

  // Button label, one text coloured by the shape: ink where the accent patch
  // lies, stone elsewhere. The colour moves with the patch, never blends.
  child(lx, vLabel(tau), () => {
    lx.font = `700 56px ${SANS}`;
    lx.textAlign = "center";
    const text = () => lx.fillText("Réserver", 0, capSans56 / 2);
    const patch = () => roundRect(lx, px0, py0, Math.max(px0, px1), Math.max(py0, py1), patchR(tau));
    lx.save();
    patch();
    lx.rect(-W, -H, 2 * W, 2 * H);
    lx.clip("evenodd");
    lx.fillStyle = STONE; text();
    lx.restore();
    lx.save();
    patch();
    lx.clip();
    lx.fillStyle = INK; text();
    lx.restore();
  });

  // Loader arc, turning at one turn per 0.75 s.
  child(lx, vArc(tau), () => {
    const a = (2 * Math.PI * (tau - T.loader)) / 0.75;
    lx.strokeStyle = INK; lx.lineWidth = 12; lx.lineCap = "round";
    lx.beginPath(); lx.arc(0, 0, 44, a, a + 1.5 * Math.PI); lx.stroke();
  });

  // Check.
  child(lx, vCheck(tau), () => {
    lx.strokeStyle = ACCENT; lx.lineWidth = 12; lx.lineCap = "round"; lx.lineJoin = "round";
    checkPath(lx, [[-30, 3], [-8, 24], [32, -19]], checkDraw(tau));
  });

  // Player.
  child(lx, vPlayDisk(tau), () => {
    lx.fillStyle = ACCENT;
    lx.beginPath(); lx.arc(-328, 0, 72, 0, Math.PI * 2); lx.fill();
  });
  child(lx, vPlayIcon(tau) * vPlayDisk(tau), () => {
    lx.fillStyle = INK;
    lx.beginPath(); lx.moveTo(-346, -30); lx.lineTo(-298, 0); lx.lineTo(-346, 30); lx.closePath(); lx.fill();
  });
  child(lx, vPauseIcon(tau), () => {
    lx.fillStyle = INK;
    lx.fillRect(-352, -28, 16, 56);
    lx.fillRect(-320, -28, 16, 56);
  });
  child(lx, vTitle(tau), () => {
    lx.font = `700 64px ${DISPLAY}`;
    lx.textAlign = "left";
    lx.fillStyle = STONE;
    lx.fillText("Tehilim 23", WAVE_LEFT, -24);
  });
  child(lx, vWave(tau), () => {
    const edge = WAVE_LEFT + progress(tau) * WAVE_WIDTH;
    WAVE.forEach((bh, i) => {
      const x = WAVE_LEFT + i * WAVE_PITCH;
      lx.fillStyle = STONE;
      lx.fillRect(x, WAVE_Y - bh / 2, WAVE_BAR, bh);
      if (edge > x) {
        lx.fillStyle = ACCENT;
        lx.fillRect(x, WAVE_Y - bh / 2, Math.min(WAVE_BAR, edge - x), bh);
      }
    });
  });

  // Knob and bell.
  const kx = knobX(tau), kr = knobR(tau);
  child(lx, vKnob(tau), () => {
    lx.fillStyle = STONE;
    lx.beginPath(); lx.arc(kx, 0, kr, 0, Math.PI * 2); lx.fill();
  });
  child(lx, vBell(tau) * vKnob(tau), () => bell(lx, kx, kr / 40));

  // The wall.
  child(lx, vStones(tau), () => {
    lx.fillStyle = STONE;
    for (const { rect, grow } of stoneGrowth) {
      const g = grow(tau);
      if (g <= 0.002) continue;
      const [x0, x1, y0, y1] = rect;
      roundRect(lx, x0, y1 - (y1 - y0) * g, x1, y1, 8);
      lx.fill();
    }
  });

  // Toast.
  child(lx, vToastCheck(tau), () => {
    lx.strokeStyle = INK; lx.lineWidth = 8; lx.lineCap = "round"; lx.lineJoin = "round";
    checkPath(lx, [[-222, 1], [-212, 11], [-194, -9]], 1);
  });
  child(lx, vToastText(tau), () => {
    lx.font = `700 48px ${SANS}`;
    lx.textAlign = "left";
    lx.fillStyle = STONE;
    lx.fillText("Siyoum · 150/150", -152, capSans48 / 2);
  });

  c.drawImage(layer, 0, 0);

  // The signature, part of the frame: it never moves.
  c.fillStyle = INK;
  c.textAlign = "center";
  c.font = `700 48px ${DISPLAY}`;
  c.fillText("Petite Jérusalem", CX, 1440);
  child(c, vTagline(tau), () => {
    c.font = `700 32px ${SANS}`;
    c.fillText("Gratuite, sans publicité", CX, 1496);
  });
}

const fold = (t) => t - D * Math.floor(t / D);

/** Frame at time t (seconds), with motion blur unless asked otherwise. */
function renderAt(t, { motionBlur = true } = {}) {
  if (!motionBlur) {
    drawSample(ctx, fold(t));
    return;
  }
  const sum = new Uint16Array(W * H * 4);
  for (let k = 0; k < SUBSAMPLES; k++) {
    // 180 degree shutter: the samples span half of the frame, around t.
    drawSample(sx, fold(t + ((k + 0.5) / SUBSAMPLES - 0.5) * (SHUTTER / FPS)));
    const px = sx.getImageData(0, 0, W, H).data;
    for (let i = 0; i < px.length; i++) sum[i] += px[i];
  }
  const out = ctx.createImageData(W, H);
  for (let i = 0; i < sum.length; i++) out.data[i] = (sum[i] + SUBSAMPLES / 2) >> 2;
  ctx.putImageData(out, 0, 0);
}

// ------------------------------------------------------------------ preview

const FRAMES = D * FPS;
let frame = 0, playing = false;
const scrub = document.getElementById("scrub");
const clock = document.getElementById("clock");
const playButton = document.getElementById("play");
const blurBox = document.getElementById("blur");

function show(n) {
  frame = ((n % FRAMES) + FRAMES) % FRAMES;
  // While playing, a single sample keeps up with the screen.
  renderAt(frame / FPS, { motionBlur: blurBox.checked && !playing });
  scrub.value = frame;
  clock.textContent = `${frame} / ${FRAMES - 1} · ${(frame / FPS).toFixed(2)} s`;
}
function tick() {
  // The display refresh only schedules the next frame; time is the frame number.
  if (!playing) return;
  show(frame + 1);
  requestAnimationFrame(tick);
}
function setPlaying(on) {
  playing = on;
  playButton.textContent = on ? "❚❚ Pause" : "▶ Lire";
  if (on) requestAnimationFrame(tick); else show(frame);
}
playButton.addEventListener("click", () => setPlaying(!playing));
scrub.addEventListener("input", () => { setPlaying(false); show(Number(scrub.value)); });
blurBox.addEventListener("change", () => show(frame));
addEventListener("keydown", (e) => {
  if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
  if (e.key === "ArrowRight") { setPlaying(false); show(frame + (e.shiftKey ? 30 : 1)); }
  if (e.key === "ArrowLeft") { setPlaying(false); show(frame - (e.shiftKey ? 30 : 1)); }
});
