<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
    #monde-canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
    }
    .monde-etiquette {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      padding: 12px 30px;
      border-radius: 999px;
      background: var(--surface);
      box-shadow: var(--ombre-carte);
      font-family: var(--police);
      font-weight: 800;
      font-size: 40px;
      color: var(--encre);
      white-space: nowrap;
    }
  </style>
  <div id="root" data-composition-id="monde" data-width="1080" data-height="1920">
    <canvas id="monde-canvas" width="1080" height="1920"></canvas>
    <div id="monde-chaharit" class="monde-etiquette">Cha'harit</div>
    <div id="monde-minha" class="monde-etiquette">Min'ha</div>
    <div id="monde-arvit" class="monde-etiquette">Arvit</div>
  </div>
  <script src="assets/three.min.js"></script>
  <script>
    (function () {
      // The isometric world: an archipelago floating over the screen of a
      // giant phone, one Three.js scene for the whole film, drawn from
      // timeline time alone (a linear GSAP clock calls dessiner(t)).
      const THREE = window.THREE;
      const W = 1080;
      const H = 1920;
      const DUREE = 68;

      const horloge = { t: 0 };
      let dessiner = null;
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      let pret;
      window.__hf.buildReady["monde"] = new Promise((r) => (pret = r));
      const tl = gsap.timeline({ paused: true });
      tl.to(horloge, {
        t: DUREE,
        duration: DUREE,
        ease: "none",
        onUpdate: () => dessiner && dessiner(horloge.t),
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["monde"] = tl;

      // --- Palette: docs/design.md, sections 1, 2 and 8 -------------------
      const C = {
        creme: 0xfff9f3,
        nuit: 0x1f2937,
        orange: 0xeb9f4f,
        orangeLogo: 0xfea547,
        orangeClair: 0xffd09e,
        bleu: 0x328cdc,
        bleuLogo: 0x539ee2,
        emeraude: 0x059c66,
        pierre: 0xefe4d6,
        pierre2: 0xd9c8b6,
        pierre3: 0xc2ae9f,
        brique: 0xd6c4b8,
        papier: 0xfbf4ea,
        boitier: 0x1e1b18,
        bouton: 0x2e2925,
        bois: 0xbfa27f,
        dore: 0xd9a441,
        terre: 0xb5603a,
        cire: 0xf6eedf,
        peau: 0xf0dcc6,
        kippa: 0x1e3a6e,
        blanc: 0xffffff,
      };
      const RELIURES = {
        Tehilim: "#8b4a3a",
        Michna: "#6a6234",
        Talmud: "#6e4a30",
        Tanakh: "#8c3a32",
        Halakha: "#70452e",
        Moussar: "#8a6a2c",
        Zohar: "#5a3d5c",
      };

      // --- Time helpers -----------------------------------------------------
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const p = (t, a, d) => clamp((t - a) / d);
      const outBack = (x, s = 1.6) => {
        const y = x - 1;
        return 1 + (s + 1) * y * y * y + s * y * y;
      };
      const outCubic = (x) => 1 - Math.pow(1 - x, 3);
      const inCubic = (x) => x * x * x;
      const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const outBounce = (x) => {
        const n = 7.5625;
        const d = 2.75;
        if (x < 1 / d) return n * x * x;
        if (x < 2 / d) return n * (x -= 1.5 / d) * x + 0.75;
        if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + 0.9375;
        return n * (x -= 2.625 / d) * x + 0.984375;
      };
      const lerp = (a, b, x) => a + (b - a) * x;
      const deg = (d) => (d * Math.PI) / 180;
      function hasard(seed) {
        return function () {
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const anims = [];
      const chargements = [];

      // --- Renderer, camera, light ------------------------------------------
      const canvas = document.getElementById("monde-canvas");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(C.creme);
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 3000);
      const ELEVATION = Math.asin(1 / Math.sqrt(3));
      const cible = new THREE.Vector3();
      const visee = new THREE.Vector3();
      const droite = new THREE.Vector3();
      const arriere = new THREE.Vector3();
      let azimut = deg(45);
      // An orthographic camera at the isometric elevation, turning around
      // the vertical by its azimuth (45 degrees is the true isometric view).
      function placerCamera(V, az, decalage = 80) {
        azimut = az;
        visee.set(Math.sin(az) * Math.cos(ELEVATION), Math.sin(ELEVATION), Math.cos(az) * Math.cos(ELEVATION));
        droite.set(Math.cos(az), 0, -Math.sin(az));
        arriere.set(-Math.sin(az), 0, -Math.cos(az));
        const h = V / 2;
        const w = h * (W / H);
        camera.left = -w;
        camera.right = w;
        camera.top = h;
        camera.bottom = -h;
        camera.updateProjectionMatrix();
        camera.position.copy(cible).addScaledVector(visee, 1200);
        camera.lookAt(cible);
        // The focus sits below the frame's centre: the titles own the top.
        camera.translateY(V * (decalage / H));
        camera.updateMatrixWorld();
      }

      const ciel = new THREE.HemisphereLight(0xffffff, 0xd9c4ae, 1.4);
      scene.add(ciel);
      const LUMIERE = new THREE.Vector3(0.42, 1, 0.78).normalize();
      const soleil = new THREE.DirectionalLight(0xfff1e2, 2.25);
      soleil.castShadow = true;
      soleil.shadow.mapSize.set(2048, 2048);
      soleil.shadow.bias = -0.0004;
      soleil.shadow.normalBias = 0.03;
      scene.add(soleil, soleil.target);

      // --- Builders ---------------------------------------------------------
      const mats = new Map();
      const mat = (c) => {
        if (!mats.has(c)) mats.set(c, new THREE.MeshLambertMaterial({ color: c }));
        return mats.get(c);
      };
      const plat = (c) => new THREE.MeshBasicMaterial({ color: c });
      function maille(geo, m, parent, x = 0, y = 0, z = 0) {
        const o = new THREE.Mesh(geo, typeof m === "number" ? mat(m) : m);
        o.position.set(x, y, z);
        o.castShadow = true;
        o.receiveShadow = true;
        parent.add(o);
        return o;
      }
      function boite(parent, w, h, d, m, x = 0, y = 0, z = 0) {
        return maille(new THREE.BoxGeometry(w, h, d), m, parent, x, y + h / 2, z);
      }
      function cylindre(parent, r1, r2, h, m, x = 0, y = 0, z = 0, seg = 28) {
        return maille(new THREE.CylinderGeometry(r1, r2, h, seg), m, parent, x, y + h / 2, z);
      }
      function groupe(parent, x = 0, y = 0, z = 0) {
        const g = new THREE.Group();
        g.position.set(x, y, z);
        parent.add(g);
        return g;
      }
      function rondRect(w, h, r) {
        const s = new THREE.Shape();
        const x = -w / 2;
        const y = -h / 2;
        s.moveTo(x + r, y);
        s.lineTo(x + w - r, y);
        s.quadraticCurveTo(x + w, y, x + w, y + r);
        s.lineTo(x + w, y + h - r);
        s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        s.lineTo(x + r, y + h);
        s.quadraticCurveTo(x, y + h, x, y + h - r);
        s.lineTo(x, y + r);
        s.quadraticCurveTo(x, y, x + r, y);
        return s;
      }
      // A rounded rectangle with its texture spread over it, standing (xy).
      function plaque(w, h, r) {
        const geo = new THREE.ShapeGeometry(rondRect(w, h, r), 12);
        const pos = geo.attributes.position;
        const uv = geo.attributes.uv;
        for (let i = 0; i < pos.count; i++) uv.setXY(i, (pos.getX(i) + w / 2) / w, (pos.getY(i) + h / 2) / h);
        return geo;
      }
      // The same, lying on the ground; its top edge points away (-z).
      const dalle = (w, h, r) => plaque(w, h, r).rotateX(-Math.PI / 2);
      function etoile(parent, r, prof, m) {
        const s = new THREE.Shape();
        for (let i = 0; i < 10; i++) {
          const a = Math.PI / 2 + (i * Math.PI) / 5;
          const rr = i % 2 ? r * 0.45 : r;
          if (i) s.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
          else s.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
        }
        s.closePath();
        const geo = new THREE.ExtrudeGeometry(s, { depth: prof, bevelEnabled: true, bevelThickness: prof * 0.25, bevelSize: r * 0.06, bevelSegments: 1 });
        geo.center();
        return maille(geo, m, parent);
      }
      function flamme(parent, x, y, z, s = 1) {
        const g = groupe(parent, x, y, z);
        const ext = new THREE.Mesh(new THREE.ConeGeometry(0.1 * s, 0.34 * s, 14), plat(C.orangeLogo));
        ext.position.y = 0.17 * s;
        const int = new THREE.Mesh(new THREE.ConeGeometry(0.05 * s, 0.18 * s, 12), plat(0xffe3ad));
        int.position.y = 0.1 * s;
        g.add(ext, int);
        return g;
      }

      // Canvas textures, drawn once the fonts and images are there.
      const textures = [];
      function texture(w, h, dessin) {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = 4;
        textures.push({ c, tex, dessin });
        return tex;
      }
      function image(src) {
        const img = new Image();
        chargements.push(
          new Promise((ok) => {
            img.onload = ok;
            img.onerror = ok;
          }),
        );
        img.src = src;
        return img;
      }
      function dos(titre, couleur) {
        return texture(512, 128, (g, w, h) => {
          g.fillStyle = couleur;
          g.fillRect(0, 0, w, h);
          g.fillStyle = "#e3c27a";
          g.fillRect(28, 0, 8, h);
          g.fillRect(44, 0, 3, h);
          g.fillRect(w - 36, 0, 8, h);
          g.fillRect(w - 47, 0, 3, h);
          g.fillStyle = "#ecd08e";
          g.textAlign = "center";
          g.textBaseline = "middle";
          g.font = `600 64px "Playfair Display"`;
          g.fillText(titre, w / 2, h / 2 + 2);
        });
      }
      function tuile(numero, couleur, encre, coche) {
        return texture(256, 256, (g, w, h) => {
          g.fillStyle = couleur;
          g.fillRect(0, 0, w, h);
          g.fillStyle = encre;
          g.textAlign = "center";
          g.textBaseline = "middle";
          g.font = `800 ${numero.length > 2 ? 104 : 124}px "Manrope"`;
          g.fillText(numero, w / 2, coche ? h * 0.42 : h / 2);
          if (coche) {
            g.strokeStyle = encre;
            g.lineWidth = 16;
            g.lineCap = "round";
            g.lineJoin = "round";
            g.beginPath();
            g.moveTo(w * 0.36, h * 0.76);
            g.lineTo(w * 0.47, h * 0.86);
            g.lineTo(w * 0.66, h * 0.66);
            g.stroke();
          }
        });
      }

      // A phone lying on the ground: body, screen, notch, buttons. s scales
      // the details from the real phone's 5.8 units wide.
      function telephone(parent, w, l, r, prof, ecranMat) {
        const g = groupe(parent);
        const s = w / 5.25;
        maille(
          new THREE.ExtrudeGeometry(rondRect(w + 0.55 * s, l + 0.55 * s, r * 1.25), {
            depth: prof,
            bevelEnabled: true,
            bevelThickness: prof * 0.1,
            bevelSize: prof * 0.12,
            bevelSegments: 2,
            curveSegments: 10,
          }).rotateX(-Math.PI / 2),
          C.boitier,
          g,
        );
        const dessus = prof * 1.1;
        const ecran = new THREE.Mesh(dalle(w, l, r), ecranMat);
        ecran.position.y = dessus + 0.002 * s;
        g.add(ecran);
        const encoche = new THREE.Mesh(dalle(1.7 * s, 0.42 * s, 0.21 * s), plat(C.boitier));
        encoche.position.set(0, dessus + 0.02 * s, -l / 2 + 0.55 * s);
        g.add(encoche);
        boite(g, 0.08 * s, 0.16 * s, 1.3 * s, C.bouton, w / 2 + 0.3 * s, prof * 0.3, -l * 0.2);
        boite(g, 0.08 * s, 0.16 * s, 0.8 * s, C.bouton, -w / 2 - 0.3 * s, prof * 0.3, -l * 0.25);
        g.userData.dessus = dessus;
        return g;
      }

      // A real screen of the app, standing in the world as a phone that
      // always faces the camera.
      const panneaux = [];
      function panneau(parent, src, x, y, z, s = 1) {
        const g = groupe(parent, x, y, z);
        g.scale.setScalar(s);
        const corps = new THREE.Mesh(new THREE.ExtrudeGeometry(rondRect(2.4, 4.6, 0.36), { depth: 0.16, bevelEnabled: false }), mat(C.boitier));
        corps.castShadow = true;
        corps.position.set(0, 2.3, -0.17);
        g.add(corps);
        const tex = new THREE.Texture();
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = 8;
        const img = image(src);
        chargements.at(-1).then(() => {
          tex.image = img;
          const a = img.width / img.height;
          const b = 2.16 / 4.3;
          if (a > b) {
            tex.repeat.set(b / a, 1);
            tex.offset.set((1 - b / a) / 2, 0);
          } else {
            tex.repeat.set(1, a / b);
            tex.offset.set(0, 1 - a / b);
          }
          tex.needsUpdate = true;
        });
        const ecran = new THREE.Mesh(plaque(2.16, 4.3, 0.28), new THREE.MeshBasicMaterial({ map: tex }));
        ecran.position.set(0, 2.3, 0.005);
        g.add(ecran);
        panneaux.push(g);
        return g;
      }

      // A floating island: a stone slab and its stepped underside.
      const iles = [];
      function ile(x, z, w, d, rond = false) {
        const g = groupe(scene, x, 0, z);
        if (rond) {
          cylindre(g, w / 2, w / 2, 0.8, C.pierre, 0, -0.8, 0, 64);
          cylindre(g, w / 2 - 0.2, w * 0.38, 1.0, C.pierre2, 0, -1.8, 0, 64);
          cylindre(g, w * 0.36, w * 0.18, 1.2, C.pierre3, 0, -3.0, 0, 48);
        } else {
          boite(g, w, 0.8, d, C.pierre, 0, -0.8, 0);
          boite(g, w * 0.82, 1.0, d * 0.82, C.pierre2, 0, -1.8, 0);
          boite(g, w * 0.58, 1.0, d * 0.58, C.pierre3, 0, -2.8, 0);
          boite(g, w * 0.32, 0.9, d * 0.32, C.pierre3, 0, -3.7, 0);
        }
        g.userData.phase = iles.length * 1.7;
        g.userData.y = 0;
        iles.push(g);
        return g;
      }

      // Motion helpers.
      function eclore(obj, debut, duree = 0.45, fin = Infinity) {
        anims.push((t) => {
          const x = p(t, debut, duree);
          obj.visible = t >= debut && t < fin;
          obj.scale.setScalar(Math.max(0.0001, outBack(x)));
        });
      }
      // Dropped from the sky, bouncing on its place.
      function tomber(obj, debut, duree = 0.7, hauteur = 10) {
        const y0 = obj.position.y;
        anims.push((t) => {
          const x = p(t, debut, duree);
          obj.visible = t >= debut;
          obj.position.y = y0 + (1 - outBounce(x)) * hauteur;
        });
      }

      // ======================================================================
      // The ground: the screen of a giant phone, and the cream around it
      // ======================================================================
      const SOL = -9;
      // Proportioned like the small phone (5.25 x 10.85), wide enough that the
      // year's view never reaches its edge.
      const ECRAN = { x: -55, z: -61, w: 220, l: 455 };
      const dehors = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), plat(C.creme));
      dehors.rotation.x = -Math.PI / 2;
      dehors.position.y = SOL - 6;
      scene.add(dehors);
      const solMat = plat(C.orange);
      const geant = telephone(scene, ECRAN.w, ECRAN.l, 22, 3.2, solMat);
      geant.position.set(ECRAN.x, SOL - geant.userData.dessus, ECRAN.z);
      const vagueMat = plat(C.bleu);
      const vague = new THREE.Mesh(new THREE.CircleGeometry(1, 96).rotateX(-Math.PI / 2), vagueMat);
      scene.add(vague);
      const ombreMat = new THREE.ShadowMaterial({ color: 0x5a3d28, opacity: 0.2 });
      const ombreSol = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), ombreMat);
      ombreSol.rotation.x = -Math.PI / 2;
      ombreSol.position.y = SOL + 0.22;
      ombreSol.receiveShadow = true;
      scene.add(ombreSol);

      // The small phone of the opening, on the cream, its screen the brand's
      // orange with the logo in white.
      const logo = image("assets/marque/logo-transparent.png");
      const ecranAccroche = new THREE.MeshBasicMaterial({
        map: texture(512, 1058, (g, w, h) => {
          g.fillStyle = "#eb9f4f";
          g.fillRect(0, 0, w, h);
          if (!logo.width) return;
          const t = document.createElement("canvas");
          t.width = 360;
          t.height = 360;
          const tg = t.getContext("2d");
          tg.drawImage(logo, 0, 0, 360, 360);
          tg.globalCompositeOperation = "source-in";
          tg.fillStyle = "#ffffff";
          tg.fillRect(0, 0, 360, 360);
          g.drawImage(t, (w - 360) / 2, h * 0.42 - 180);
        }),
      });
      const ACCROCHE = new THREE.Vector3(0, SOL - 6, 300);
      const petit = telephone(scene, 5.25, 10.85, 0.68, 0.36, ecranAccroche);
      petit.position.copy(ACCROCHE);
      const ecranPetit = new THREE.Vector3(ACCROCHE.x, ACCROCHE.y + petit.userData.dessus, ACCROCHE.z);
      anims.push((t) => {
        petit.position.y = ACCROCHE.y + 1.2 + Math.sin(t * 1.6) * 0.25 * (1 - p(t, 2.8, 0.6));
        petit.rotation.z = Math.sin(t * 1.1) * 0.05 * (1 - p(t, 2.8, 0.6));
        ecranPetit.y = petit.position.y + petit.userData.dessus;
        petit.visible = t < 4.3;
      });

      // ======================================================================
      // Islands
      // ======================================================================
      const VILLE = new THREE.Vector3(0, 0, 0);
      const PARTAGE = new THREE.Vector3(-24, 0, -12);
      const ETUDE = new THREE.Vector3(-22, 0, -44);
      const PRIERE = new THREE.Vector3(-50, 0, -50);
      const OBJECTIFS = new THREE.Vector3(-48, 0, -82);
      const SUIVI = new THREE.Vector3(-82, 0, -97);

      // --- The little Jerusalem, rising out of the screen ---------------------
      const ileVille = ile(VILLE.x, VILLE.z, 9.5, 9.5);
      anims.push((t) => {
        const x = p(t, 4.25, 1.3);
        ileVille.userData.y = (1 - outBack(x, 1.2)) * -26;
      });
      const tour = groupe(ileVille, -2.2, 0, -2.2);
      boite(tour, 1.7, 3.6, 1.7, C.brique);
      for (const [cx, cz] of [
        [-0.64, -0.64],
        [0, -0.64],
        [0.64, -0.64],
        [-0.64, 0],
        [0.64, 0],
        [-0.64, 0.64],
        [0, 0.64],
        [0.64, 0.64],
      ]) {
        boite(tour, 0.42, 0.44, 0.42, C.brique, cx, 3.6, cz);
      }
      boite(tour, 0.22, 0.8, 0.05, 0x7a6352, 0, 2.3, 0.86);
      boite(tour, 0.05, 0.8, 0.22, 0x7a6352, 0.86, 2.3, 0);
      const muraille = groupe(ileVille, -2.3, 0, 0.9);
      {
        const r = hasard(7);
        const teintes = [0xe3d1c0, 0xd9c5b2, 0xe8d9c9, 0xd2bda9];
        for (let rang = 0; rang < 3; rang++) {
          const decal = rang % 2 ? 0.5 : 0;
          for (let z = -1.8 + decal; z < 3.4; z += 1) {
            const long = Math.min(0.96, 3.8 - z);
            if (long < 0.3) continue;
            boite(muraille, 0.8, 0.5, long, teintes[Math.floor(r() * 4)], 0, rang * 0.52, z + long / 2 - 0.48);
          }
        }
        for (let z = -1.7; z < 3.4; z += 0.9) boite(muraille, 0.8, 0.38, 0.45, C.brique, 0, 1.56, z);
      }
      const maison = groupe(ileVille, 1.2, 0, -1.4);
      boite(maison, 2.4, 1.4, 2.4, C.pierre);
      cylindre(maison, 1.0, 1.0, 0.8, C.brique, 0, 1.4, 0, 32);
      maille(new THREE.SphereGeometry(1.03, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), C.orangeLogo, maison, 0, 2.2, 0);
      cylindre(maison, 0.05, 0.05, 0.45, C.orange, 0, 3.2, 0, 10);
      maille(new THREE.SphereGeometry(0.12, 14, 10), C.orange, maison, 0, 3.7, 0);
      boite(maison, 0.5, 0.85, 0.05, 0x7a6352, 0, 0, 1.21);
      function cypres(parent, x, z, h) {
        const g = groupe(parent, x, 0, z);
        cylindre(g, 0.08, 0.1, 0.4, 0x8a5a3a, 0, 0, 0, 10);
        const f = maille(new THREE.SphereGeometry(0.5, 20, 16), C.orange, g, 0, 0.35 + h / 2, 0);
        f.scale.set(0.85, h, 0.85);

            const couleur = aujourdhui ? C.orangeLogo : chabbat ? 0xfbf7f0 : teintes[Math.floor(r() * 4)];
            const o = boite(ileSuivi, 0.62, 0.46, 0.92, couleur, 0, rang * 0.5, zDe(k));
            const debut = i >= 0 ? lerp(48.2, 50.3, i / (mois.length - 1)) : 51.65 + (COLONNES - 6 - k) * 0.022 + rang * 0.01;
            const y0 = o.position.y;
            anims.push((t) => {
              const x = p(t, debut, 0.3);
              o.visible = t >= debut;
              o.scale.setScalar(Math.max(0.0001, outBack(x)));
              o.position.y = y0 + (1 - outCubic(x)) * 1.6;
            });
          }
        }
      }
      const PIED = new THREE.Vector3(0, 0, zDe(COLONNES - 1) - 2.6);
      const pied = groupe(ileSuivi, PIED.x, 0, PIED.z);
      boite(pied, 1.2, 1.1, 1.2, C.brique);
      tomber(pied, 53.4, 0.6, 8);
      const lumieres = groupe(ileSuivi, PIED.x, 1.1, PIED.z);
      lumieres.scale.setScalar(1.25);
      const lampe = groupe(lumieres);
      {
        const corpsLampe = maille(new THREE.SphereGeometry(0.5, 24, 16), C.terre, lampe, 0, 0.22, 0);
        corpsLampe.scale.set(1.1, 0.48, 0.72);
        const bec = maille(new THREE.CylinderGeometry(0.1, 0.14, 0.5, 14), C.terre, lampe, 0.55, 0.26, 0);
        bec.rotation.z = Math.PI / 2 - 0.25;
        maille(new THREE.TorusGeometry(0.16, 0.05, 8, 18, Math.PI), C.terre, lampe, -0.6, 0.3, 0).rotation.y = Math.PI / 2;
      }
      const flammeLampe = flamme(lampe, 0.8, 0.3, 0, 1.5);
      const bougie = groupe(lumieres);
      cylindre(bougie, 0.18, 0.18, 0.95, C.cire, 0, 0, 0, 20);
      flamme(bougie, 0, 0.95, 0, 1.4);
      const menorah = groupe(lumieres);
      cylindre(menorah, 0.35, 0.4, 0.12, C.dore, 0, 0, 0, 24);
      cylindre(menorah, 0.06, 0.06, 0.8, C.dore, 0, 0.12, 0, 12);
      boite(menorah, 1.6, 0.08, 0.08, C.dore, 0, 0.88, 0);
      for (let i = 0; i < 7; i++) {
        const x = (i - 3) * 0.25;
        cylindre(menorah, 0.045, 0.045, 0.2, C.cire, x, 0.96, 0, 10);
        flamme(menorah, x, 1.16, 0, 0.8);
      }
      const lune = groupe(lumieres);
      maille(new THREE.SphereGeometry(0.5, 28, 20), 0xf1e4c3, lune, 0, 0.8, 0);
      const etoiles = groupe(lumieres);
      etoile(etoiles, 0.42, 0.14, plat(C.orangeLogo)).position.set(0, 0.95, 0);
      etoile(etoiles, 0.28, 0.12, plat(C.bleuLogo)).position.set(-0.55, 0.55, 0.3);
      etoile(etoiles, 0.24, 0.1, plat(C.bleuLogo)).position.set(0.5, 1.45, -0.3);
      // The galaxy: past a hundred days, the light the app gives at 106.
      const galaxie = groupe(lumieres, 0, 1.6, 0);
      {
        const r = hasard(106);
        const geo = new THREE.SphereGeometry(0.05, 6, 4);
        const tons = [0xffffff, 0xa9ccea, 0x8f7ae6, 0xfea547, 0xd8ccff];
        for (let i = 0; i < 220; i++) {
          const branche = i % 2;
          const d = Math.pow(r(), 0.7) * 2.2;
          const a = d * 2.4 + branche * Math.PI + (r() - 0.5) * 0.6;
          const o = new THREE.Mesh(geo, plat(tons[Math.floor(r() * tons.length)]));
          o.position.set(Math.cos(a) * d, (r() - 0.5) * 0.12, Math.sin(a) * d);
          o.scale.setScalar(0.6 + r() * 1.4);
          galaxie.add(o);
        }
        galaxie.add(new THREE.Mesh(new THREE.SphereGeometry(0.28, 20, 14), plat(0xffe7b0)));
        galaxie.rotation.x = 0.5;
      }
      const SERIE = [
        [lampe, 54.6],
        [bougie, 55.3],
        [menorah, 55.55],
        [lune, 55.8],
        [etoiles, 56.05],
        [galaxie, 56.45],
      ];
      SERIE.forEach(([o, debut], i) => {
        const fin = SERIE[i + 1] ? SERIE[i + 1][1] : Infinity;
        if (o !== galaxie) eclore(o, debut, i === 0 ? 0.45 : 0.22, fin);
      });
      anims.push((t) => {
        flammeLampe.scale.setScalar(Math.max(0.0001, outBack(p(t, 54.9, 0.4))));
        galaxie.visible = t >= 56.45;
        galaxie.rotation.y = t * 0.7;
        galaxie.scale.setScalar(Math.max(0.0001, 0.8 * outBack(p(t, 56.45, 0.8), 1.2)));
      });

      // --- Waves of color over the giant screen --------------------------------
      // [time, color, centre, radius, duration]
      const BOUT = SUIVI.clone().add(PIED);
      const VAGUES = [
        [10.0, C.bleu, PARTAGE, 150, 0.9],
        [20.2, C.emeraude, ETUDE, 150, 0.9],
        [30.4, C.orangeClair, PRIERE, 150, 0.9],
        [34.0, C.creme, PRIERE, 150, 0.7],
        [35.3, C.nuit, PRIERE, 150, 0.6],
        [38.0, C.orange, OBJECTIFS, 150, 0.9],
        [47.3, C.creme, SUIVI, 160, 0.9],
        [53.3, C.nuit, BOUT, 160, 0.8],
        [58.0, C.orange, BOUT, 220, 1.2],
      ];
      // The ground's color, and how far into the night it is (0 to 1).
      function sol(t) {
        let base = C.orange;
        let enCours = null;
        for (const vg of VAGUES) {
          if (t >= vg[0] + vg[4]) base = vg[1];
          else if (t >= vg[0]) enCours = vg;
        }
        solMat.color.setHex(base);
        vague.visible = !!enCours;
        let nuitX = base === C.nuit ? 1 : 0;
        if (enCours) {
          const [t0, c, centre, r, d] = enCours;
          const x = outCubic(p(t, t0, d));
          vagueMat.color.setHex(c);
          // Over the giant screen (which sits a few hundredths above SOL), under the shadows.
          vague.position.set(centre.x, SOL + 0.15, centre.z);
          vague.scale.setScalar(Math.max(0.001, r * x));
          if (c === C.nuit) nuitX = x;
          else if (base === C.nuit) nuitX = 1 - x;
        }
        return nuitX;
      }

      // --- The camera's route ---------------------------------------------------
      // [time, target x, y, z, view height, azimuth in degrees, flight]
      const I = (vec, dy = 1.4) => [vec.x, vec.y + dy, vec.z];
      const ROUTE = [
        [0, ACCROCHE.x, ACCROCHE.y + 1.6, ACCROCHE.z, 20.5, 25, 0],
        [3.0, ACCROCHE.x, ACCROCHE.y + 1.6, ACCROCHE.z, 18, 55, 0],
        // Into the orange under the logo, so the last frame is all orange.
        [4.2, ecranPetit.x, ecranPetit.y + 1.2, ecranPetit.z + 3.3, 0.35, 45, 0],
        // At 4.2 the frame is all orange: the camera is inside the screen.
        [4.2001, VILLE.x + 4, SOL, VILLE.z + 4, 0.35, 45, 0],
        [6.2, ...I(VILLE, 3.6), 22, 45, 0],
        [9.9, ...I(VILLE, 3.6), 23.5, 50, 0],
        [11.2, ...I(PARTAGE, 1.4), 19.5, 45, 1],
        [19.8, ...I(PARTAGE, 1.4), 21, 40, 0],
        [21.1, ...I(ETUDE, 3.0), 19, 45, 1],
        [30.2, ...I(ETUDE, 3.0), 20.5, 52, 0],
        [31.4, ...I(PRIERE, 2.4), 21, 45, 1],
        [37.8, ...I(PRIERE, 2.4), 22, 100, 0],
        [39.0, ...I(OBJECTIFS, 1.6), 19, 45, 1],
        [47.0, ...I(OBJECTIFS, 1.6), 20, 52, 0],
        [48.3, SUIVI.x, 1.6, SUIVI.z + zDe(COLONNES - 3), 12.5, 45, 1],
        [51.4, SUIVI.x, 1.6, SUIVI.z + zDe(COLONNES - 3), 13.5, 45, 0],
        [52.8, SUIVI.x, 1.6, SUIVI.z, 64, 45, 0],
        [53.2, SUIVI.x, 1.6, SUIVI.z, 64.5, 45, 0],
        [54.4, SUIVI.x, 4.4, SUIVI.z + PIED.z, 15, 45, 0],
        [57.9, SUIVI.x, 4.4, SUIVI.z + PIED.z, 16, 55, 0],
        [59.7, ECRAN.x, SOL, ECRAN.z, 900, 45, 0],
        [68, ECRAN.x, SOL, ECRAN.z, 935, 45, 0],
      ];
      function route(t) {
        let i = 0;
        while (i < ROUTE.length - 2 && t >= ROUTE[i + 1][0]) i++;
        const a = ROUTE[i];
        const b = ROUTE[i + 1];
        const x = p(t, a[0], b[0] - a[0]);
        // The dive accelerates into the screen; the way out decelerates.
        const e = b[0] === 4.2 ? inCubic(x) : a[0] === 4.2001 ? outCubic(x) : inOut(x);
        cible.set(lerp(a[1], b[1], e), lerp(a[2], b[2], e), lerp(a[3], b[3], e));
        // Zooms over orders of magnitude move on a log scale.
        const log = Math.max(a[4], b[4]) / Math.min(a[4], b[4]) > 8;
        let V = log ? Math.exp(lerp(Math.log(a[4]), Math.log(b[4]), e)) : lerp(a[4], b[4], e);
        if (b[6]) V += Math.sin(Math.PI * e) * 0.35 * Math.max(a[4], b[4]);
        return [V, deg(lerp(a[5], b[5], e))];
      }

      // --- Labels anchored in the world -----------------------------------------
      const v = new THREE.Vector3();
      function versEcran(pos) {
        v.copy(pos).project(camera);
        return [((v.x + 1) / 2) * W, ((1 - v.y) / 2) * H];
      }
      function poser(el, pos, opacite, dy = 0, monte = 0) {
        el.style.opacity = opacite.toFixed(3);
        if (opacite <= 0) return;
        const [x, y] = versEcran(pos);
        el.style.transform = `translate(${x.toFixed(1)}px, ${(y + dy + monte).toFixed(1)}px) translate(-50%, -50%)`;
      }
      const fondu = (t, debut, fin, d = 0.2) => Math.min(p(t, debut, d), 1 - p(t, fin, d));
      const COURSE = [
        [31.0, 178],
        [32.6, 150],
        [33.6, 132],
        [34.5, 80],
        [35.4, 20],
        [35.8, -16],
      ];
      function angleSoleil(t) {
        let i = 0;
        while (i < COURSE.length - 2 && t >= COURSE[i + 1][0]) i++;
        const a = COURSE[i];
        const b = COURSE[i + 1];
        return lerp(a[1], b[1], inOut(p(t, a[0], b[0] - a[0])));
      }
      // The sun crosses the frame's plane, behind the island.
      const posSoleil = (d) => {
        const th = deg(d);
        return droite
          .clone()
          .multiplyScalar(Math.cos(th) * 5.2)
          .addScaledVector(arriere, 3.5)
          .setY(0.2 + Math.sin(th) * 4.4);
      };
      const etiquettes = [
        [document.getElementById("monde-chaharit"), 33.6, 132],
        [document.getElementById("monde-minha"), 34.5, 80],
        [document.getElementById("monde-arvit"), 35.4, 20],
      ];
      const ancre = new THREE.Vector3();

      dessiner = (t) => {
        for (const a of anims) a(t);
        for (const g of iles) g.position.y = g.userData.y + Math.sin(t * 0.9 + g.userData.phase) * 0.14;

        // Night falls flat: the light dims and cools, the shadow deepens.
        const n = sol(t);
        ciel.intensity = lerp(1.4, 1.3, n);
        ciel.color.setHex(n > 0.5 ? 0xdce6ff : 0xffffff);
        soleil.intensity = lerp(2.25, 0.9, n);
        soleil.color.setHex(n > 0.5 ? 0xb8cdef : 0xfff1e2);
        ombreMat.opacity = lerp(0.2, 0.1, n);

        const [V, az] = route(t);
        placerCamera(V, az);
        for (const g of panneaux) g.rotation.y = az;

        // The prayer's sky.
        astre.visible = t >= 31.0 && t < 35.8;
        astre.position.copy(posSoleil(angleSoleil(t)));
        soirees.forEach((e, i) => {
          const x = p(t, 35.5 + i * 0.07, 0.3) * (1 - p(t, 38.0, 0.4));
          e.visible = x > 0;
          e.scale.setScalar(Math.max(0.0001, outBack(Math.min(1, x))));
          const [dx, y] = e.userData.pos;
          e.position.copy(droite.clone().multiplyScalar(dx).addScaledVector(arriere, 3.5)).setY(y);
          e.rotation.y = az;
        });
        chandeliers.forEach((f, i) => {
          f.visible = t >= 35.9 + i * 0.18;
          f.scale.setScalar(Math.max(0.0001, outBack(p(t, 35.9 + i * 0.18, 0.35))));
        });
        lecture.rotation.y = az;
        ondes.forEach(({ o, m, debut }) => {
          const x = p(t, debut, 1.1);
          o.visible = x > 0 && x < 1;
          o.scale.setScalar(0.9 + x * 3.2);
          o.rotation.y = az;
          m.opacity = 1 - x;
        });

        // The shadow follows the camera.
        const r = Math.min(V * 0.8, 120);
        soleil.position.copy(cible).addScaledVector(LUMIERE, 200);
        soleil.target.position.copy(cible);
        const sc = soleil.shadow.camera;
        sc.left = -r;
        sc.right = r;
        sc.top = r;
        sc.bottom = -r;
        sc.near = 1;
        sc.far = 420;
        sc.updateProjectionMatrix();

        renderer.render(scene, camera);

        for (const [el, debut, d] of etiquettes) {
          ancre.copy(posSoleil(d)).add(ilePriere.position);
          poser(el, ancre, fondu(t, debut, 36.3), -96, (1 - outCubic(p(t, debut, 0.3))) * 24);
        }
      };

      Promise.all([
        document.fonts.load('600 80px "Playfair Display"'),
        document.fonts.load('800 80px "Manrope"'),
        document.fonts.load('700 80px "Noto Serif Hebrew"'),
        ...chargements,
      ])
        .catch(() => null)
        .then(() => {
          for (const { c, tex, dessin } of textures) {
            dessin(c.getContext("2d"), c.width, c.height);
            tex.needsUpdate = true;
          }
          dessiner(horloge.t);
          pret();
        });
      dessiner(0);
    })();
  </script>
</template>
