<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
    #monde-canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
    }
    .monde-etiquette {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      padding: 12px 28px;
      border-radius: 999px;
      background: var(--surface);
      box-shadow: var(--ombre-carte);
      font-family: var(--police);
      font-weight: 700;
      font-size: 38px;
      color: var(--encre);
      white-space: nowrap;
    }
    .monde-semaine {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      font-family: var(--police);
      font-weight: 600;
      font-size: 30px;
      color: var(--encre-douce);
      white-space: nowrap;
    }
    .monde-compteur {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      display: flex;
      align-items: baseline;
      gap: 14px;
      padding: 14px 30px;
      border-radius: 999px;
      background: var(--surface);
      box-shadow: var(--ombre-carte);
      white-space: nowrap;
    }
    #monde-jours {
      font-family: var(--police-titre);
      font-weight: 700;
      font-size: 54px;
      color: var(--orange-encre);
    }
    #monde-nom {
      font-family: var(--police);
      font-weight: 700;
      font-size: 34px;
      color: var(--encre);
    }
  </style>
  <div id="root" data-composition-id="monde" data-width="1080" data-height="1920">
    <canvas id="monde-canvas" width="1080" height="1920"></canvas>
    <div id="monde-chaharit" class="monde-etiquette">Cha'harit</div>
    <div id="monde-minha" class="monde-etiquette">Min'ha</div>
    <div id="monde-arvit" class="monde-etiquette">Arvit</div>
    <div id="monde-s1" class="monde-semaine">Haazinu</div>
    <div id="monde-s2" class="monde-semaine">26&nbsp;sept.</div>
    <div id="monde-s3" class="monde-semaine">3&nbsp;oct.</div>
    <div id="monde-s4" class="monde-semaine">Berechit</div>
    <div id="monde-s5" class="monde-semaine">Noah</div>
    <div id="monde-lumiere" class="monde-compteur">
      <span id="monde-jours">1</span><span id="monde-nom">La vieille lampe</span>
    </div>
  </div>
  <script src="assets/three.min.js"></script>
  <script>
    (function () {
      // The isometric world: one Three.js scene for the whole film, drawn
      // from timeline time alone (a linear GSAP clock calls render(t)).
      const THREE = window.THREE;
      const W = 1080;
      const H = 1920;
      const DUREE = 86;

      const horloge = { t: 0 };
      let dessiner = null;
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      let pret;
      window.__hf.buildReady["monde"] = new Promise((r) => (pret = r));
      const tl = gsap.timeline({ paused: true });
      tl.to(horloge, {
        t: DUREE,
        duration: DUREE,
        ease: "none",
        onUpdate: () => dessiner && dessiner(horloge.t),
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["monde"] = tl;

      // --- Palette: docs/design.md, sections 1, 2 and 8 -------------------
      const C = {
        fond: 0xfff9f3,
        nuit: 0x1f2937,
        pierre: 0xe6d8ca,
        brique: 0xd6c4b8,
        joint: 0xc2ae9f,
        orange: 0xfea547,
        plein: 0xeb9f4f,
        bleu: 0x539ee2,
        bleuFonce: 0x328cdc,
        papier: 0xfbf4ea,
        boitier: 0x1e1b18,
        bouton: 0x2e2925,
        bois: 0xbfa27f,
        dore: 0xd9a441,
        terre: 0xb5603a,
        cire: 0xf6eedf,
        ruban: 0xc0392b,
        peau: 0xf0dcc6,
      };
      const RELIURES = {
        Tehilim: "#8b4a3a",
        Michna: "#6a6234",
        Talmud: "#6e4a30",
        Tanakh: "#8c3a32",
        Halakha: "#70452e",
        Moussar: "#8a6a2c",
      };

      // --- Time helpers -----------------------------------------------------
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const p = (t, a, d) => clamp((t - a) / d);
      const outBack = (x) => {
        const s = 1.5;
        const y = x - 1;
        return 1 + (s + 1) * y * y * y + s * y * y;
      };
      const outCubic = (x) => 1 - Math.pow(1 - x, 3);
      const inOut = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
      const lerp = (a, b, x) => a + (b - a) * x;
      function hasard(seed) {
        return function () {
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const anims = [];

      // --- Renderer, camera, light ------------------------------------------
      const canvas = document.getElementById("monde-canvas");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      const FOND = new THREE.Color(C.fond);
      const NUIT = new THREE.Color(C.nuit);
      scene.background = FOND.clone();

      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 400);
      // The true isometric angle: azimuth 45 degrees, elevation 35.26.
      const VISEE = new THREE.Vector3(1, 1, 1).normalize();
      // Screen right and back, on the ground.
      const DROITE = new THREE.Vector3(1, 0, -1).normalize();
      const ARRIERE = new THREE.Vector3(-1, 0, -1).normalize();
      const cible = new THREE.Vector3();
      function placerCamera(V) {
        const h = V / 2;
        const w = h * (W / H);
        camera.left = -w;
        camera.right = w;
        camera.top = h;
        camera.bottom = -h;
        camera.updateProjectionMatrix();
        camera.position.copy(cible).addScaledVector(VISEE, 150);
        camera.lookAt(cible);
        // The focus sits 80 px below the frame's centre: the captions own the top.
        camera.translateY(V * (80 / H));
        camera.updateMatrixWorld();
      }

      const ciel = new THREE.HemisphereLight(0xffffff, 0xd9c4ae, 1.35);
      scene.add(ciel);
      const LUMIERE = new THREE.Vector3(0.42, 1, 0.78).normalize();
      const soleil = new THREE.DirectionalLight(0xfff1e2, 2.2);
      soleil.castShadow = true;
      soleil.shadow.mapSize.set(2048, 2048);
      soleil.shadow.bias = -0.0004;
      soleil.shadow.normalBias = 0.03;
      scene.add(soleil, soleil.target);

      const solMat = new THREE.MeshBasicMaterial({ color: C.fond });
      const sol = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), solMat);
      sol.rotation.x = -Math.PI / 2;
      scene.add(sol);
      const ombreMat = new THREE.ShadowMaterial({ color: 0x7a5a40, opacity: 0.16 });
      const ombreSol = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), ombreMat);
      ombreSol.rotation.x = -Math.PI / 2;
      ombreSol.position.y = 0.003;
      ombreSol.receiveShadow = true;
      scene.add(ombreSol);

      // --- Builders ---------------------------------------------------------
      const mats = new Map();
      const mat = (c) => {
        if (!mats.has(c)) mats.set(c, new THREE.MeshLambertMaterial({ color: c }));
        return mats.get(c);
      };
      const plat = (c) => new THREE.MeshBasicMaterial({ color: c });
      function maille(geo, m, parent, x = 0, y = 0, z = 0) {
        const o = new THREE.Mesh(geo, typeof m === "number" ? mat(m) : m);
        o.position.set(x, y, z);
        o.castShadow = true;
        o.receiveShadow = true;
        parent.add(o);
        return o;
      }
      // A box standing on y (its base), centred on x and z.
      function boite(parent, w, h, d, m, x = 0, y = 0, z = 0) {
        return maille(new THREE.BoxGeometry(w, h, d), m, parent, x, y + h / 2, z);
      }
      function cylindre(parent, r1, r2, h, m, x = 0, y = 0, z = 0, seg = 28) {
        return maille(new THREE.CylinderGeometry(r1, r2, h, seg), m, parent, x, y + h / 2, z);
      }
      function groupe(parent, x = 0, y = 0, z = 0) {
        const g = new THREE.Group();
        g.position.set(x, y, z);
        parent.add(g);
        return g;
      }
      function rondRect(w, h, r) {
        const s = new THREE.Shape();
        const x = -w / 2;
        const y = -h / 2;
        s.moveTo(x + r, y);
        s.lineTo(x + w - r, y);
        s.quadraticCurveTo(x + w, y, x + w, y + r);
        s.lineTo(x + w, y + h - r);
        s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        s.lineTo(x + r, y + h);
        s.quadraticCurveTo(x, y + h, x, y + h - r);
        s.lineTo(x, y + r);
        s.quadraticCurveTo(x, y, x + r, y);
        return s;
      }
      function etoile(parent, r, prof, m) {
        const s = new THREE.Shape();
        for (let i = 0; i < 10; i++) {
          const a = Math.PI / 2 + (i * Math.PI) / 5;
          const rr = i % 2 ? r * 0.45 : r;
          if (i) s.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
          else s.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
        }
        s.closePath();
        const geo = new THREE.ExtrudeGeometry(s, {
          depth: prof,
          bevelEnabled: true,
          bevelThickness: prof * 0.25,
          bevelSize: r * 0.06,
          bevelSegments: 1,
        });
        geo.center();
        const o = maille(geo, m, parent);
        o.rotation.y = Math.PI / 4;
        return o;
      }
      function flamme(parent, x, y, z, s = 1) {
        const g = groupe(parent, x, y, z);
        const ext = new THREE.Mesh(new THREE.ConeGeometry(0.1 * s, 0.34 * s, 14), plat(C.orange));
        ext.position.y = 0.17 * s;
        const int = new THREE.Mesh(new THREE.ConeGeometry(0.05 * s, 0.18 * s, 12), plat(0xffe3ad));
        int.position.y = 0.1 * s;
        g.add(ext, int);
        return g;
      }

      // Text drawn on a canvas, for book covers, tiles and the calendar.
      const textures = [];
      function texture(w, h, dessin) {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = 4;
        textures.push({ c, tex, dessin });
        return tex;
      }
      function couverture(titre, couleur, sous = "") {
        return texture(360, 500, (g, w, h) => {
          g.fillStyle = couleur;
          g.fillRect(0, 0, w, h);
          g.strokeStyle = "#e3c27a";
          g.lineWidth = 6;
          g.strokeRect(26, 26, w - 52, h - 52);
          g.lineWidth = 2;
          g.strokeRect(40, 40, w - 80, h - 80);
          g.fillStyle = "#ecd08e";
          g.textAlign = "center";
          g.textBaseline = "middle";
          let taille = 78;
          g.font = `600 ${taille}px "Playfair Display"`;
          while (g.measureText(titre).width > w - 100 && taille > 30) {
            taille -= 2;
            g.font = `600 ${taille}px "Playfair Display"`;
          }
          g.fillText(titre, w / 2, h * 0.44);
          // The fleuron: a diamond between two rules.
          g.fillRect(w / 2 - 70, h * 0.56 - 1.5, 46, 3);
          g.fillRect(w / 2 + 24, h * 0.56 - 1.5, 46, 3);
          g.beginPath();
          g.moveTo(w / 2, h * 0.56 - 12);
          g.lineTo(w / 2 + 12, h * 0.56);
          g.lineTo(w / 2, h * 0.56 + 12);
          g.lineTo(w / 2 - 12, h * 0.56);
          g.fill();
          if (sous) {
            g.font = `600 36px "Playfair Display"`;
            g.fillText(sous, w / 2, h * 0.67);
          }
        });
      }
      function tuile(numero, couleur, encre, coche) {
        const tex = texture(256, 256, (g, w, h) => {
          g.fillStyle = couleur;
          g.fillRect(0, 0, w, h);
          g.fillStyle = encre;
          g.textAlign = "center";
          g.textBaseline = "middle";
          g.font = `800 ${numero.length > 2 ? 104 : 124}px "Manrope"`;
          g.fillText(numero, w / 2, coche ? h * 0.42 : h / 2);
          if (coche) {
            g.strokeStyle = encre;
            g.lineWidth = 16;
            g.lineCap = "round";
            g.lineJoin = "round";
            g.beginPath();
            g.moveTo(w * 0.36, h * 0.76);
            g.lineTo(w * 0.47, h * 0.86);
            g.lineTo(w * 0.66, h * 0.66);
            g.stroke();
          }
        });
        return tex;
      }

      // ======================================================================
      // The little Jerusalem, on the phone (the logo's pieces, in stone)
      // ======================================================================
      const ville = groupe(scene, 0, 0, 0);
      const corps = maille(
        new THREE.ExtrudeGeometry(rondRect(5.8, 11.4, 0.95), {
          depth: 0.36,
          bevelEnabled: true,
          bevelThickness: 0.035,
          bevelSize: 0.05,
          bevelSegments: 2,
          curveSegments: 10,
        }).rotateX(-Math.PI / 2),
        C.boitier,
        ville,
      );
      const BASE = 0.4;
      const ecranMat = plat(C.fond);
      const ecran = new THREE.Mesh(new THREE.ShapeGeometry(rondRect(5.25, 10.85, 0.68), 10).rotateX(-Math.PI / 2), ecranMat);
      ecran.position.y = BASE + 0.001;
      ville.add(ecran);
      const ecranOmbre = new THREE.Mesh(
        new THREE.ShapeGeometry(rondRect(5.25, 10.85, 0.68), 10).rotateX(-Math.PI / 2),
        new THREE.ShadowMaterial({ color: 0x7a5a40, opacity: 0.18 }),
      );
      ecranOmbre.position.y = BASE + 0.004;
      ecranOmbre.receiveShadow = true;
      ville.add(ecranOmbre);
      const encoche = new THREE.Mesh(new THREE.ShapeGeometry(rondRect(1.7, 0.42, 0.21)).rotateX(-Math.PI / 2), plat(C.boitier));
      encoche.position.set(0, BASE + 0.006, -4.98);
      ville.add(encoche);
      boite(ville, 0.08, 0.16, 1.3, C.bouton, 2.93, 0.12, -2.3);
      boite(ville, 0.08, 0.16, 0.8, C.bouton, -2.93, 0.12, -2.9);

      // The tower, at the back.
      const tour = groupe(ville, -1.45, BASE, -3.3);
      boite(tour, 1.6, 3.5, 1.6, C.brique);
      for (const [cx, cz] of [
        [-0.6, -0.6],
        [0, -0.6],
        [0.6, -0.6],
        [-0.6, 0],
        [0.6, 0],
        [-0.6, 0.6],
        [0, 0.6],
        [0.6, 0.6],
      ]) {
        boite(tour, 0.4, 0.42, 0.4, C.brique, cx, 3.5, cz);
      }
      boite(tour, 0.2, 0.75, 0.05, 0x7a6352, 0, 2.2, 0.81);
      boite(tour, 0.05, 0.75, 0.2, 0x7a6352, 0.81, 2.2, 0);
      boite(tour, 0.05, 0.5, 0.2, 0x7a6352, 0.81, 1.0, 0);

      // The wall, coming towards the viewer, with its battlements.
      const muraille = groupe(ville, -1.6, BASE, 0);
      {
        const r = hasard(7);
        const teintes = [0xe3d1c0, 0xd9c5b2, 0xe8d9c9, 0xd2bda9];
        for (let rang = 0; rang < 3; rang++) {
          const decal = rang % 2 ? 0.5 : 0;
          for (let z = -2.4 + decal; z < 2.2; z += 1) {
            const long = Math.min(0.96, 2.6 - z);
            if (long < 0.3) continue;
            boite(muraille, 0.8, 0.5, long, teintes[Math.floor(r() * 4)], 0, rang * 0.52, z + long / 2 - 0.48);
          }
        }
        for (let z = -2.3; z < 2.2; z += 0.9) boite(muraille, 0.8, 0.38, 0.45, C.brique, 0, 1.56, z);
      }

      // The domed house, its drum and its orange dome.
      const maison = groupe(ville, 0.95, BASE, -1.5);
      boite(maison, 2.3, 1.3, 2.3, C.pierre);
      cylindre(maison, 0.95, 0.95, 0.75, C.brique, 0, 1.3, 0, 32);
      const coupole = maille(new THREE.SphereGeometry(0.98, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), C.orange, maison, 0, 2.05, 0);
      cylindre(maison, 0.05, 0.05, 0.45, C.plein, 0, 3.0, 0, 10);
      maille(new THREE.SphereGeometry(0.12, 14, 10), C.plein, maison, 0, 3.5, 0);
      boite(maison, 0.5, 0.8, 0.05, 0x7a6352, 0, 0, 1.16);

      // Two cypresses, orange as in the logo.
      function cypres(x, z, h) {
        const g = groupe(ville, x, BASE, z);
        cylindre(g, 0.08, 0.1, 0.4, 0x8a5a3a, 0, 0, 0, 10);
        const f = maille(new THREE.SphereGeometry(0.5, 20, 16), C.plein, g, 0, 0.35 + h / 2, 0);
        f.scale.set(0.85, h, 0.85);
        return g;
      }
      const cypres1 = cypres(2.1, -3.7, 2.6);
      const cypres2 = cypres(2.1, 0.75, 2.0);

      // The open book, in front, blue as in the logo.
      function livreOuvert(parent, x, y, z, s = 1) {
        const g = groupe(parent, x, y, z);
        g.scale.setScalar(s);
        boite(g, 3.5, 0.1, 2.3, C.bleuFonce);
        const gauche = boite(g, 1.62, 0.2, 2.1, C.papier, -0.84, 0.1, 0);
        gauche.rotation.z = 0.12;
        const droite = boite(g, 1.62, 0.2, 2.1, C.papier, 0.84, 0.1, 0);
        droite.rotation.z = -0.12;
        boite(g, 0.08, 0.12, 2.12, C.bleuFonce, 0, 0.1, 0);
        return g;
      }
      const livre = livreOuvert(ville, 0.45, BASE, 3.75);

      // The star, falling onto the city.
      const etoileVille = etoile(ville, 0.85, 0.3, C.bleu);

      // The candles of the prayer chapter, left of the book.
      const bougies = [];
      const chandeliers = [];
      for (const z of [3.2, 4.1]) {
        const g = groupe(ville, -2.25, BASE, z);
        cylindre(g, 0.19, 0.19, 0.07, C.dore, 0, 0, 0, 18);
        cylindre(g, 0.15, 0.15, 1.05, C.cire, 0, 0.07, 0, 18);
        const f = flamme(g, 0, 1.12, 0, 2.0);
        bougies.push(f);
        chandeliers.push(g);
      }

      // The sun of the prayer chapter, and the stars of the evening.
      const astre = new THREE.Mesh(new THREE.SphereGeometry(0.78, 28, 18), plat(C.orange));
      scene.add(astre);
      const soirees = [];
      {
        const pos = [
          [-4.3, 6.4, 0x539ee2, 0.42],
          [-2.5, 7.6, 0xfea547, 0.32],
          [3.4, 7.3, 0x539ee2, 0.46],
          [4.6, 5.2, 0xfea547, 0.3],
          [-4.9, 4.4, 0xfea547, 0.34],
        ];
        for (const [dx, y, c, r] of pos) {
          const e = etoile(scene, r, 0.12, plat(c));
          e.castShadow = false;
          e.position.copy(DROITE.clone().multiplyScalar(dx).addScaledVector(ARRIERE, 3.5)).setY(y);
          soirees.push(e);
        }
      }

      // Rising out of the screen, in the hook.
      function surgir(obj, debut, duree = 0.55, profondeur = 4.5) {
        const y0 = obj.position.y;
        anims.push((t) => {
          const x = p(t, debut, duree);
          obj.visible = t >= debut;
          obj.position.y = y0 - (1 - outBack(x)) * profondeur;
        });
      }
      function eclore(obj, debut, duree = 0.45, fin = Infinity) {
        anims.push((t) => {
          const x = p(t, debut, duree);
          obj.visible = t >= debut && t < fin;
          obj.scale.setScalar(Math.max(0.0001, outBack(x)));
        });
      }
      surgir(livre, 0.35, 0.6, 1.2);
      surgir(tour, 0.9, 0.6, 4.4);
      surgir(muraille, 1.15, 0.6, 2.4);
      surgir(maison, 1.45, 0.6, 3.6);
      surgir(cypres1, 1.75, 0.55, 3.2);
      surgir(cypres2, 1.95, 0.55, 3.2);
      chandeliers.forEach((g, i) => surgir(g, 2.15 + i * 0.1, 0.5, 1.4));
      anims.push((t) => {
        const x = p(t, 3.2, 0.7);
        etoileVille.visible = t >= 3.2;
        const e = 1 - Math.pow(1 - x, 2.2);
        etoileVille.position.set(-0.3, lerp(15, 6.5, e) + (x >= 1 ? 0 : 0), -2.4);
        etoileVille.rotation.y = Math.PI / 4 + (1 - outCubic(x)) * Math.PI * 4;
        const rebond = x >= 1 ? Math.max(0, 1 - (t - 3.9) / 0.35) : 0;
        etoileVille.scale.setScalar(1 + 0.18 * Math.sin(rebond * Math.PI));
      });

      // ======================================================================
      // Sharing: readers around a book, their parts, the bar to the siyoum
      // ======================================================================
      const PARTAGE = new THREE.Vector3(0, 0, -24);
      const partage = groupe(scene, PARTAGE.x, 0, PARTAGE.z);
      cylindre(partage, 3.1, 3.1, 0.36, C.pierre, 0, 0, 0, 56);
      boite(partage, 1.3, 0.75, 1.0, C.brique, 0, 0.36, 0);
      livreOuvert(partage, 0, 1.11, 0, 0.42);
      const lecteurs = [];
      const COULEURS_LECTEURS = [C.plein, C.bleu, 0xc9b29c, C.plein, C.bleu, 0xc9b29c];
      for (let i = 0; i < 6; i++) {

        // Labels, placed on what they name.
        for (const [el, debut, deg] of etiquettes) {
          poser(el, posSoleil(deg), fondu(t, debut, 47.95), -92, (1 - outCubic(p(t, debut, 0.3))) * 20);
        }
        semaines.forEach((el, i) => {
          const pos = new THREE.Vector3(SUIVI.x + colX(COLONNES - 5 + i), 0, SUIVI.z + 0.9);
          poser(el, pos, fondu(t, 67.9 + i * 0.08, 69.15, 0.22), 30, (1 - outCubic(p(t, 67.9 + i * 0.08, 0.3))) * 16);
        });
        let palier = SERIE[0];
        for (const s of SERIE) if (t >= s[1]) palier = s;
        if (jours.textContent !== palier[2]) jours.textContent = palier[2];
        if (nom.textContent !== palier[3]) nom.textContent = palier[3];
        const piedHaut = new THREE.Vector3(SUIVI.x + PIED.x, 3.9, SUIVI.z + PIED.z);
        poser(compteur, piedHaut, fondu(t, 72.2, 75.0, 0.3), -40);
      };

      // The covers and tiles are drawn once the fonts are there.
      Promise.all([
        document.fonts.load('600 80px "Playfair Display"'),
        document.fonts.load('800 80px "Manrope"'),
        document.fonts.load('700 40px "Manrope"'),
      ])
        .catch(() => null)
        .then(() => {
          for (const { c, tex, dessin } of textures) {
            dessin(c.getContext("2d"), c.width, c.height);
            tex.needsUpdate = true;
          }
          dessiner(horloge.t);
          pret();
        });
      dessiner(0);
    })();
  </script>
</template>
