      /* The app's tokens (docs/design.md, sections 1, 2 and 8). */
      :root {
        --fond: #fff9f3;
        --surface: #ffffff;
        --encre: #35312a;
        --encre-douce: #6d6759;
        --orange: #eb9f4f;
        --orange-encre: #d46d01;
        --bleu: #328cdc;
        --emeraude: #059c66;
        --nuit: #1f2937;
        --ombre-carte: 0 2px 6px rgba(90, 61, 40, 0.12), 0 10px 28px rgba(90, 61, 40, 0.16);
        --ombre-pop: 0 6px 16px rgba(90, 61, 40, 0.18), 0 24px 56px rgba(90, 61, 40, 0.26);
        --police-titre: "Playfair Display", Georgia, serif;
        --police: "Manrope", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--fond);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--police);
        color: var(--encre);
      }
      /* Kinetic titles: big words that slam in on the voice, at the top. */
      .titre {
        position: absolute;
        left: 0;
        top: 236px;
        width: 1080px;
        text-align: center;
      }
      .titre .ligne {
        display: block;
        overflow: hidden;
        padding: 6px 0 14px;
        margin-bottom: -18px;
      }
      .titre .mot {
        display: inline-block;
        font-family: var(--police);
        font-weight: 800;
        font-size: 118px;
        line-height: 1.02;
        letter-spacing: -0.035em;
        color: var(--titre, #ffffff);
      }
      .titre .grand {
        font-size: 156px;
      }
      .titre .pilule {
        padding: 2px 40px 14px;
        border-radius: 999px;
        background: var(--pilule-fond, #ffffff);
        color: var(--pilule-encre, var(--orange-encre));
        box-shadow: var(--ombre-pop);
      }
      .titre .ligne.pilules {
        overflow: visible;
        padding-top: 22px;
      }
    </style>
