      /* The app's tokens (docs/design.md, sections 1, 2 and 8). */
      :root {
        --fond: #fff9f3;
        --surface: #ffffff;
        --encre: #35312a;
        --encre-douce: #6d6759;
        --orange-logo: #fea547;
        --orange: #eb9f4f;
        --orange-encre: #d46d01;
        --bleu-logo: #539ee2;
        --bleu: #328cdc;
        --nuit: #1f2937;
        --nuit-encre: #f3f4f6;
        --boitier: #1e1b18;
        --ombre-carte: 0 2px 6px rgba(122, 90, 64, 0.1), 0 10px 28px rgba(122, 90, 64, 0.14);
        --ombre-pop: 0 6px 16px rgba(122, 90, 64, 0.16), 0 24px 56px rgba(122, 90, 64, 0.24);
        --police-titre: "Playfair Display", Georgia, serif;
        --police: "Manrope", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--fond);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--police);
        color: var(--encre);
      }
      /* The phone that carries a real screen, facing the viewer, never tilted. */
      .telephone {
        position: absolute;
        left: 240px;
        top: 556px;
        width: 600px;
        height: 1040px;
        padding: 16px;
        border-radius: 74px;
        background: var(--boitier);
        box-shadow: var(--ombre-pop);
      }
      .telephone .ecran {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 58px;
        overflow: hidden;
        background: var(--fond);
      }
      .telephone .ecran img {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
      }
    </style>
