    <!-- Seules les polices PAR DÉFAUT bloquent le premier rendu : Source Sans 3
         (interface) et Frank Ruhl Libre (titres du site, et lecture en hébreu :
         Google sert ses sous-ensembles latin et hébreu à la même adresse). Le
         repli des signes de cantillation (teamim) est le sous-ensemble hébreu
         de Noto Serif Hebrew embarqué dans /fonts (voir main.css), préchargé
         ici : la famille Google du même nom ne servait plus, ce sous-ensemble
         passe avant elle dans chaque pile. Les polices au choix (Lora, Nunito,
         David Libre, Heebo) sont injectées à la demande par useFonts.ts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="/fonts/noto-serif-hebrew-var.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Structured data -->
    <script type="application/ld+json">

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Petite Jérusalem",
        "url": "https://petite-jerusalem.fr/",
        "logo": "https://petite-jerusalem.fr/favicon.png"
      }
    </script>
    <!-- L'apparence, posée avant le premier pixel : le bundle l'appliquerait
         quelques dizaines de millisecondes plus tard, le temps d'un éclair
         blanc sur un téléphone en sombre. Même règle que useColorScheme, dont
         la clé de stockage est reprise ici : le choix gardé sur l'appareil,
         sinon le réglage du système. Un compte connecté peut ensuite corriger,
         comme il le fait déjà pour le thème et les polices. -->
    <script>
      try {
        var pref = JSON.parse(localStorage.getItem("pj-preferences:guest") || "{}").colorScheme;
        var dark =
          pref === "dark" ||
          (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {
        /* Stockage indisponible : le bundle s'en chargera. */
      }
    </script>
