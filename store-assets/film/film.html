<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petite Jérusalem, le film</title>
<style>
  @font-face { font-family: "Manrope"; src: url(fonts/manrope-latin.woff2) format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Playfair Display"; src: url(fonts/playfair-latin.woff2) format("woff2"); font-weight: 400 900; }
  :root { --stage: #f4f1ea; --ink: #35312a; }
  html, body { margin: 0; background: var(--stage); color: var(--ink); font-family: Manrope, sans-serif; }
  main { display: grid; place-items: center; gap: 12px; padding: 16px; }
  canvas { display: block; width: min(92vw, 82vh); height: auto; box-shadow: 0 10px 40px rgba(53, 49, 42, .12); }
  .bar { display: flex; align-items: center; gap: 12px; width: min(92vw, 82vh); }
  .bar input { flex: 1; accent-color: #DE4F17; }
  .bar button { font: 600 14px Manrope, sans-serif; border: 0; border-radius: 999px; padding: 8px 16px; background: var(--ink); color: #fff; cursor: pointer; }
  .bar output { font: 500 14px Manrope, sans-serif; font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }
  body.render main { padding: 0; }
  body.render canvas { width: 1440px; box-shadow: none; }
  body.render .bar { display: none; }
</style>
</head>
<body>
<main>
  <canvas id="c" width="1440" height="1440"></canvas>
  <div class="bar">
    <button id="play" type="button">Lecture</button>
    <input id="scrub" type="range" min="0" max="22" step="0.001" value="0" aria-label="Position">
    <output id="clock">0,00 s</output>
  </div>
</main>
<!-- Seuil de la goutte : l'alpha flouté repasse en bord net autour de 0,5. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="thr" color-interpolation-filters="sRGB">
    <feComponentTransfer><feFuncA type="linear" slope="14" intercept="-6.5"/></feComponentTransfer>
  </filter>
</svg>
<script>
"use strict";
/*
 * Petite Jérusalem, boucle de 22 s en 1440 x 1440.
 * Tout est fonction du temps : seek(t) dessine l'image de l'instant t, sans
 * minuterie ni état d'une image à l'autre. La carte des temps est dans
 * beat-map.md ; les couleurs et les polices suivent docs/design.md.
 */

// ---------------------------------------------------------------- réglages
const SIZE = 1440, HALF = SIZE / 2, FPS = 60, DUR = 22;
const BPM = 110, BEAT = 60 / BPM;

// Jetons (docs/design.md) : aucune couleur n'est écrite ailleurs qu'ici.
const C = {
  stage: "#f4f1ea",        // --color-bg-beige
  surface: "#ffffff",      // --color-surface
  ink: "#35312a",          // --color-text-primary
  primary: "#DE4F17",      // sunset, l'unique accent
  night: "#111827",        // fond sombre
  nightDeep: "#0b0f17",    // la toile autour de l'écran
  shadow: "53, 49, 42",    // ombres chaudes, en r, g, b
  // Logo (public/favicon.svg)
  gold: "#C79A3B", mortar: "#F1E7CF",
  bookL: "#1D6FDB", bookR: "#2E7BE6", spine: "#16467e", pageLine: "#CFE1FB",
};
// Les deux pochettes : Souccot (vert loulav) et Sim'hat Torah (rouge pomme).
const TRACKS = [
  { title: "Les lois de Souccot", sub: "Chiour · Moadim", tint: "#4E8A2E", at: 0.34, total: 2290 },
  { title: "La joie de Sim'hat Torah", sub: "Chiour · Moadim", tint: "#B8322A", at: 0.02, total: 1935 },
];
// Textes (espaces insécables : U+202F avant ?, U+00A0 avant :).
const QUESTION = "On se partage les Tehilim ?";
const ANSWER = "150 psaumes à douze : fini ce soir.";
const PILL_START = "Créer une chaîne";
const PILL_END = "Ouvrir Petite Jérusalem";

// ------------------------------------------------------------ carte des temps
const T = {
  click: 1 * BEAT,          // le curseur clique « Créer une chaîne »
  toSpin: 0.62,             // la pastille devient un sablier
  toCheck: 4 * BEAT,        // le sablier devient une coche
  split: 6 * BEAT,          // la coche se scinde en trois points
  qFly: 8 * BEAT,           // le point gauche monte en question
  aFly: 10 * BEAT,          // le point droit descend en réponse
  merge: 13.5 * BEAT,       // les bulles reviennent au point du milieu
  tri: 15 * BEAT,           // le point se plie en triangle de lecture
  drop: 18 * BEAT,          // l'appui, sur le drop
  pull: 10.0,               // la caméra recule sur l'écran du lecteur
  heart: 20 * BEAT,         // le coeur se remplit
  swipe: 21 * BEAT,         // la pochette glisse, le chiour suivant arrive
  retint: 11.95,            // l'app prend la couleur de la nouvelle pochette
  toVol: 23 * BEAT,         // la caméra descend sur le volume
  drag1: 13.5,              // le volume monte au maximum
  drag2: 14.1,              // ... et le curseur continue de tirer
  bend: 14.95,              // la ligne se plie en courbe
  click2: 30 * BEAT,        // clic sur le dernier point
  dive: 16.38,              // plongée dans le point
  ask: 17.2,                // « Ouvrir Petite Jérusalem » sort de la lumière
  thin: 18.1,               // la pastille s'amincit en trait
  fan: 18.9,                // le trait se déploie en logo
  fold: 20.4,               // le logo se replie en trait
  thicken: 21.2,            // le trait s'épaissit en « Créer une chaîne »
};
const GLIDE = 0.8;

// ------------------------------------------------------------------ courbes
function cubicBezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = (s) => ((ax * s + bx) * s + cx) * s;
  const Y = (s) => ((ay * s + by) * s + cy) * s;
  return (x) => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let lo = 0, hi = 1, s = x;
    for (let i = 0; i < 48; i++) {
      if (X(s) < x) lo = s; else hi = s;
      s = (lo + hi) / 2;
    }
    return Y(s);
  };
}
const EASE = cubicBezier(0.45, 0, 0.15, 1);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const lin = (t, t0, d = GLIDE) => clamp((t - t0) / d);
const glide = (t, t0, d = GLIDE) => EASE(lin(t, t0, d));
/** Sous-fenêtre [a, b] d'une progression linéaire, adoucie par la courbe. */
const sub = (p, a, b) => EASE(clamp((p - a) / (b - a)));
/** Le contenu part dans la première moitié, arrive dans la seconde. */
const outHalf = (u) => 1 - clamp(u / 0.5);
const inHalf = (u) => clamp((u - 0.5) / 0.5);
/** Temps calé sur l'image : un compteur ne change pas entre deux sous-images. */
const frameTime = (t) => Math.floor(t * FPS + 1e-6) / FPS;

function hex(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mix(a, b, u) {
  const A = hex(a), B = hex(b);
  const c = A.map((v, i) => Math.round(lerp(v, B[i], u)));
  return "#" + c.map((v) => v.toString(16).padStart(2, "0")).join("");
}
function rgba(h, a) {
  const [r, g, b] = hex(h);
  return `rgba(${r}, ${g}, ${b}, ${a})`;
}

// ------------------------------------------------------------------ caméra
const CAM = {
  chat: { x: 0, y: 0, z: 1.35 },
  tri: { x: 0, y: 0, z: 2.5 },
  app: { x: 0, y: -370, z: 1.15 },
  vol: { x: 0, y: 110, z: 2.1 },
  land: { x: 1760, y: -140, z: 1 },
};
function camLerp(a, b, u) {
  return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), z: Math.exp(lerp(Math.log(a.z), Math.log(b.z), u)) };
}
const toScreen = (cam, p) => ({ x: (p.x - cam.x) * cam.z + HALF, y: (p.y - cam.y) * cam.z + HALF });

// Graphique : huit points, le dernier est le bouton du volume.
const CHART_X = Array.from({ length: 8 }, (_, i) => 1380 + (i * 920) / 7);
const CHART_V = [0, 9, 24, 46, 71, 98, 127, 150];
const BASE_Y = 110, CHART_H = 540;
const CHART_Y = CHART_V.map((v) => BASE_Y - (v / 150) * CHART_H);
const KNOB_R = 15;
const DIVE_Z = 95;

function chartE(t, i) {
  return sub(lin(t, T.bend), 0.025 * i, 0.825 + 0.025 * i);
}
function knobPos(t) {
  let x = -240 + 480 * 0.55, y = BASE_Y;
  if (t >= T.drag1) x = lerp(x, 240, glide(t, T.drag1, 0.6));
  if (t >= T.drag2) x = lerp(240, CHART_X[7], glide(t, T.drag2));
  if (t >= T.bend) y = lerp(BASE_Y, CHART_Y[7], chartE(t, 7));
  return { x, y };
}

function camAt(t) {
  if (t >= T.ask - 0.02) return CAM.chat;
  let c = camLerp(CAM.chat, CAM.tri, glide(t, T.tri));
  if (t >= T.pull) c = camLerp(c, CAM.app, glide(t, T.pull));
  if (t >= T.toVol) c = camLerp(c, CAM.vol, glide(t, T.toVol));
  if (t >= T.drag2) c = camLerp(CAM.vol, CAM.land, glide(t, T.drag2));
  if (t >= T.dive) {
    // Plongée : le point glisse au centre pendant que le zoom monte, en log.
    const e = glide(t, T.dive);
    const K = { x: CHART_X[7], y: CHART_Y[7] };
    const s0 = toScreen(CAM.land, K);
    const z = Math.exp(lerp(0, Math.log(DIVE_Z), e));
    const sx = lerp(s0.x, HALF, e), sy = lerp(s0.y, HALF, e);
    c = { x: K.x - (sx - HALF) / z, y: K.y - (sy - HALF) / z, z };
  }
  return c;
}

// ------------------------------------------------------------------ dessin
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
// Calques de la goutte : des canvas du document, pour que le filtre url(#thr) s'y applique.
const layer = () => Object.assign(document.createElement("canvas"), { width: SIZE, height: SIZE });
const gooA = layer(), gA = gooA.getContext("2d");
const gooB = layer(), gB = gooB.getContext("2d");

function setCam(g, cam) {
  g.setTransform(cam.z, 0, 0, cam.z, HALF - cam.x * cam.z, HALF - cam.y * cam.z);
}
/** Ombres douces en trois couches, qui grandissent avec la hauteur de la forme. */
function softShadow(g, h, z, draw, strength = 1) {
  const layers = [[0.015, 0.04, 0.10], [0.06, 0.16, 0.08], [0.14, 0.40, 0.07]];
  for (const [oy, bl, a] of layers) {
    g.save();
    g.shadowColor = `rgba(${C.shadow}, ${a * strength})`;
    g.shadowOffsetY = oy * h * z;
    g.shadowBlur = bl * h * z;
    draw();
    g.restore();
  }
}
function capsule(g, cx, cy, w, h, r = Math.min(w, h) / 2) {
  g.beginPath();
  g.roundRect(cx - w / 2, cy - h / 2, w, h, Math.min(r, w / 2, h / 2));
}
function font(weight, size, family = "Manrope") {
  return `${weight} ${size}px "${family}"`;
}

// ---------------------------------------------------------- la pastille
const PILL = { w: 460, h: 120 };
function pressAmt(t) {
  // Appuis du curseur : [début, fin] ; la pression monte et descend en 70 ms.
  const presses = [[T.click, T.click + 0.12], [T.click + DUR, T.click + DUR + 0.12], [T.drop, T.drop + 0.12],
    [T.swipe - 0.05, T.swipe + GLIDE], [T.drag1 - 0.05, T.drag2 + GLIDE], [T.click2, T.click2 + 0.12]];
  let a = 0;
  for (const [s, e] of presses) a = Math.max(a, Math.min(clamp((t - s) / 0.07), clamp((e + 0.07 - t) / 0.07)));
  return EASE(a);
}
function pillShape(g, t, cam, w, h, cy, label, labelAlpha, dip) {
  const s = 1 - 0.03 * dip;
  softShadow(g, h * s, cam.z, () => { capsule(g, 0, cy, w * s, h * s); g.fillStyle = C.ink; g.fill(); });
  if (labelAlpha > 0.001) {
    g.save();
    g.globalAlpha = labelAlpha;
    g.fillStyle = "#ffffff";
    g.font = font(600, 38 * s);
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText(label, 0, cy + 1);
    g.restore();
  }
}

// ---------------------------------------------- génération : sablier, coche
function drawGenerate(g, t, cam) {
  setCam(g, cam);
  const dip = t < 2 ? pressAmt(t) : 0;
  const u = lin(t, T.toSpin), e = EASE(u);
  if (u <= 0) { pillShape(g, t, cam, PILL.w, PILL.h, 0, PILL_START, 1, dip); return; }

  const w = lerp(PILL.w, 96, e), h = lerp(PILL.h, 96, e);
  const uc = lin(t, T.toCheck), ec = EASE(uc);
  // Anneau : le trou s'ouvre dans la seconde moitié du glissé, se referme pour la coche.
  const ri = 34 * inHalf(u) * (1 - ec);
  const gap = Math.PI * 1.15 * inHalf(u) * (1 - ec);
  const rot = 2 * Math.PI * 1.2 * (t - T.toSpin) - Math.PI / 2;
  const draw = () => {
    g.save();
    if (gap > 0.001) {
      const ro = h / 2, rm = (ro + ri) / 2, cap = (ro - ri) / 2;
      g.beginPath();
      g.moveTo(0, 0);
      g.arc(0, 0, 400, rot + gap, rot + 2 * Math.PI);
      g.closePath();
      g.moveTo(Math.cos(rot + gap) * rm + cap, Math.sin(rot + gap) * rm);
      g.arc(Math.cos(rot + gap) * rm, Math.sin(rot + gap) * rm, cap, 0, 2 * Math.PI);
      g.moveTo(Math.cos(rot) * rm + cap, Math.sin(rot) * rm);
      g.arc(Math.cos(rot) * rm, Math.sin(rot) * rm, cap, 0, 2 * Math.PI);
      g.clip();
    }
    capsule(g, 0, 0, w, h);
    if (ri > 0.01) { g.moveTo(ri, 0); g.arc(0, 0, ri, 0, 2 * Math.PI); }
    g.fillStyle = C.ink;
    g.fill("evenodd");
    g.restore();
  };
  softShadow(g, h, cam.z, draw);
  // Libellé : il part dans la première moitié.
  if (outHalf(u) > 0) {
    g.save();
    g.globalAlpha = outHalf(u);
    g.fillStyle = "#ffffff";
    g.font = font(600, 38);
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, h / 2); g.clip();
    g.fillText(PILL_START, 0, 1);
    g.restore();
  }
  drawCheck(g, t);
}
function drawCheck(g, t) {
  const draw = inHalf(lin(t, T.toCheck));
  const fade = 1 - clamp(lin(t, T.split) / 0.35);
  if (draw <= 0 || fade <= 0) return;
  const pts = [[-19, 2], [-6, 15], [20, -13]];
  const l1 = Math.hypot(13, 13), l2 = Math.hypot(26, 28), L = (l1 + l2) * EASE(draw);
  g.save();
  g.globalAlpha = fade;
  g.strokeStyle = "#ffffff";
  g.lineWidth = 9;
  g.lineCap = "round";
  g.lineJoin = "round";
  g.beginPath();
  g.moveTo(pts[0][0], pts[0][1]);
  if (L <= l1) g.lineTo(lerp(pts[0][0], pts[1][0], L / l1), lerp(pts[0][1], pts[1][1], L / l1));
  else {
    g.lineTo(pts[1][0], pts[1][1]);
    const k = (L - l1) / l2;
    g.lineTo(lerp(pts[1][0], pts[2][0], k), lerp(pts[1][1], pts[2][1], k));
  }
  g.stroke();
  g.restore();
}

// --------------------------------------------------------------- la discussion
const DOT_R = 16, DOT_GAP = 52, MERGED_R = DOT_R * Math.sqrt(3);
const BUBBLE_H = 84;
let Q_BOX = null, A_BOX = null;
function layoutBubbles() {
  ctx.font = font(500, 34);
  const qw = ctx.measureText(QUESTION).width + 68, aw = ctx.measureText(ANSWER).width + 68;
  Q_BOX = { x: -400 + qw / 2, y: -170, w: qw, h: BUBBLE_H };
  A_BOX = { x: 400 - aw / 2, y: 170, w: aw, h: BUBBLE_H };
}
function bob(t, i) {
  const amp = 7 * clamp((t - 3.95) / 0.25) * (1 - glide(t, T.merge));
  const ph = (2 * Math.PI * (t - 3.95)) / 0.66 - i * 0.8;
  const s = Math.max(0, Math.sin(ph));
  return -amp * s * s;
}
/** Formes de la goutte, en coordonnées du monde. */
function chatShapes(t) {
  const es = glide(t, T.split);
  const em = glide(t, T.merge), um = lin(t, T.merge);
  const shapes = [];
  // Le point du milieu, qui recueille les deux autres.
  const midR = lerp(lerp(48, DOT_R, es), MERGED_R, inHalf(um) > 0 ? EASE(inHalf(um)) : 0);
  shapes.push({ x: 0, y: bob(t, 1), w: midR * 2, h: midR * 2, r: midR, white: 0 });
  // Les deux points qui volent en bulles.
  for (const side of [-1, 1]) {
    const box = side < 0 ? Q_BOX : A_BOX;
    const tf = side < 0 ? T.qFly : T.aFly;
    const ef = glide(t, tf), uf = lin(t, tf);
    const r0 = lerp(30, DOT_R, es);
    let x = lerp(0, side * DOT_GAP, es), y = bob(t, side < 0 ? 0 : 2);
    let w = r0 * 2, h = r0 * 2;
    x = lerp(x, box.x, ef); y = lerp(y, box.y, ef);
    w = lerp(w, box.w, ef); h = lerp(h, box.h, ef);
    let white = side > 0 ? inHalf(uf) : 0;
    if (um > 0) {
      // Retour : la bulle se contracte en point en glissant vers le milieu.
      const shrink = EASE(clamp(um / 0.6));
      w = lerp(box.w, DOT_R * 2, shrink); h = lerp(box.h, DOT_R * 2, shrink);
      x = lerp(box.x, 0, em); y = lerp(box.y, 0, em);
      if (side > 0) white = outHalf(um);
    }
    shapes.push({ x, y, w, h, r: Math.min(w, h) / 2, white });
  }
  return shapes;
}
function drawChat(g, t, cam) {
  const shapes = chatShapes(t);
  gA.setTransform(1, 0, 0, 1, 0, 0);
  gA.clearRect(0, 0, SIZE, SIZE);
  setCam(gA, cam);
  gA.fillStyle = C.ink;
  for (const s of shapes) { capsule(gA, s.x, s.y, s.w + 0.8, s.h + 0.8, s.r + 0.4); gA.fill(); }
  gB.setTransform(1, 0, 0, 1, 0, 0);
  gB.clearRect(0, 0, SIZE, SIZE);
  gB.filter = `blur(${(7 * cam.z).toFixed(2)}px) url(#thr)`;
  gB.drawImage(gooA, 0, 0);
  gB.filter = "none";
  // La réponse blanchit à l'intérieur de la goutte seulement.
  const reply = shapes[2];
  if (reply.white > 0.001) {
    setCam(gB, cam);
    gB.globalCompositeOperation = "source-atop";
    gB.fillStyle = rgba(C.surface, reply.white);
    capsule(gB, reply.x, reply.y, reply.w + 14, reply.h + 14, reply.r + 7);
    gB.fill();
    gB.globalCompositeOperation = "source-over";
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  softShadow(g, 84 * 0.8, cam.z, () => g.drawImage(gooB, 0, 0), 0.9);
  // Le texte se tape, lettre par lettre, une fois la bulle posée.
  drawTyped(g, t, cam, Q_BOX, QUESTION, T.qFly + GLIDE, 0.55, "#ffffff");
  drawTyped(g, t, cam, A_BOX, ANSWER, T.aFly + GLIDE, 0.6, C.ink);
  // Coche qui s'efface au début de la scission.
  setCam(g, cam);
  drawCheck(g, t);
}
function drawTyped(g, t, cam, box, text, t0, d, color) {
  const tq = frameTime(t);
  const n = Math.round(text.length * clamp((tq - t0) / d));
  const um = lin(t, T.merge);
  const alpha = 1 - clamp(um / 0.3);
  if (n <= 0 || alpha <= 0) return;
  setCam(g, cam);
  g.save();
  g.globalAlpha = alpha;
  g.fillStyle = color;
  g.font = font(500, 34);
  g.textBaseline = "middle";
  g.textAlign = "left";
  g.fillText(text.slice(0, n), box.x - box.w / 2 + 34, box.y + 1);
  g.restore();
}

// ------------------------------------------------------ le triangle de lecture
const N_TRI = 180;
const TRI_R = [];
(function buildTriangle() {
  // Triangle arrondi pointé vers la droite, décalé pour le centre optique.
  const R = 30, rc = 5, off = 4;
  const V = [0, 1, 2].map((k) => ({ x: R * Math.cos((k * 2 * Math.PI) / 3) + off, y: R * Math.sin((k * 2 * Math.PI) / 3) }));
  const G = { x: off, y: 0 };
  const pts = [];
  for (let k = 0; k < 3; k++) {
    const P = V[k], A = V[(k + 2) % 3], Bn = V[(k + 1) % 3];
    const ua = { x: (A.x - P.x) / Math.hypot(A.x - P.x, A.y - P.y), y: (A.y - P.y) / Math.hypot(A.x - P.x, A.y - P.y) };
    const ub = { x: (Bn.x - P.x) / Math.hypot(Bn.x - P.x, Bn.y - P.y), y: (Bn.y - P.y) / Math.hypot(Bn.x - P.x, Bn.y - P.y) };
    const dG = { x: G.x - P.x, y: G.y - P.y }, lg = Math.hypot(dG.x, dG.y);
    const Cc = { x: P.x + (dG.x / lg) * 2 * rc, y: P.y + (dG.y / lg) * 2 * rc };
    const ta = { x: P.x + ua.x * rc * Math.sqrt(3), y: P.y + ua.y * rc * Math.sqrt(3) };
    const tb = { x: P.x + ub.x * rc * Math.sqrt(3), y: P.y + ub.y * rc * Math.sqrt(3) };
    let a0 = Math.atan2(ta.y - Cc.y, ta.x - Cc.x), a1 = Math.atan2(tb.y - Cc.y, tb.x - Cc.x);
    while (a1 < a0) a1 += 2 * Math.PI;

function trianglePath(g, t, scale = 1) {

  if (lines > 0) {
    g.globalAlpha = lines;
    g.strokeStyle = C.mortar; g.lineWidth = 1;
    g.beginPath();
    for (const [x1, y1, x2, y2] of LOGO.mortar) { g.moveTo(x1, y1); g.lineTo(x2, y2); }
    g.stroke();
    g.strokeStyle = C.pageLine; g.lineWidth = 1.1;
    g.stroke(LOGO.pageLines);
    g.globalAlpha = 1;
  }
  if (eBook > 0.001) {
    g.save();
    g.translate(50, 62); g.scale(1, eBook); g.translate(-50, -62);
    g.strokeStyle = C.spine; g.lineWidth = 2; g.lineCap = "round";
    g.beginPath(); g.moveTo(50, 62); g.lineTo(50, 76); g.stroke();
    g.restore();
  }
  g.restore();
}
function drawEnding(g, t, cam) {
  setCam(g, cam);
  if (t < T.thin) {
    const e = glide(t, T.ask), u = lin(t, T.ask);
    const w = lerp(120, 640, e), h = lerp(0, 120, e), r = h / 2;
    if (h < 0.5) return;
    softShadow(g, h, cam.z, () => { capsule(g, 0, 0, w * EASE(clamp(u * 1.6)), h, r); g.fillStyle = C.ink; g.fill(); });
    labelIn(g, PILL_END, 0, inHalf(u));
    return;
  }
  if (t < T.fan) {
    const e = glide(t, T.thin), u = lin(t, T.thin);
    const w = lerp(640, LINE_W, e), h = lerp(120, 6, e), cy = lerp(0, LINE_Y, e);
    softShadow(g, h, cam.z, () => { capsule(g, 0, cy, w, h); g.fillStyle = C.ink; g.fill(); });
    labelIn(g, PILL_END, cy, outHalf(u));
    return;
  }
  if (t < T.thicken) {
    // Déploiement puis repli : le trait s'efface quand le logo sort de lui.
    const p = t < T.fold ? lin(t, T.fan) : 1 - lin(t, T.fold);
    const lineA = 1 - clamp(p / 0.4);
    if (lineA > 0) {
      g.save(); g.globalAlpha = lineA;
      softShadow(g, 6, cam.z, () => { capsule(g, 0, LINE_Y, LINE_W, 6); g.fillStyle = C.ink; g.fill(); });
      g.restore();
    }
    drawLogo(g, p);
    return;
  }
  const e = glide(t, T.thicken), u = lin(t, T.thicken);
  const w = lerp(LINE_W, PILL.w, e), h = lerp(6, PILL.h, e), cy = lerp(LINE_Y, 0, e);
  softShadow(g, h, cam.z, () => { capsule(g, 0, cy, w, h); g.fillStyle = C.ink; g.fill(); });
  labelIn(g, PILL_START, cy, inHalf(u));
}
function labelIn(g, text, cy, a) {
  if (a <= 0.001) return;
  g.save();
  g.globalAlpha = a;
  g.fillStyle = "#ffffff";
  g.font = font(600, 38);
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(text, 0, cy + 1);
  g.restore();
}

// ------------------------------------------------------------------ le curseur
const POINTER = new Path2D("M0 0L0 16.6L3.9 12.9L6.4 18.8L9.1 17.7L6.7 12L12 12Z");
const OFF = { x: 1580, y: 1660 };
function cursorAt(t, cam) {
  // Les cibles sont évaluées à chaque image : le curseur reste sur ce qu'il tient.
  const tt = t < 1.8 ? t + DUR : t;
  const on = (w) => () => toScreen(cam, w);
  const K = [
    [8.9, on({ x: 5, y: 6 })],
    [10.35, () => toScreen(cam, { x: 110 - 760 * glide(t, T.swipe), y: -440 })],
    [12.5, () => { const k = knobPos(t); return toScreen(cam, { x: k.x + 2, y: k.y + 2 }); }],
    [16.6, () => OFF],
    [21.75, on({ x: 70, y: 22 })],
    [22.75, () => OFF],
  ];
  let p = OFF;
  for (const [t0, target] of K) {
    if (tt < t0) break;
    const q = target();
    const e = glide(tt, t0);
    p = { x: lerp(p.x, q.x, e), y: lerp(p.y, q.y, e) };
  }
  return p;
}
function drawCursor(g, t, cam) {
  const p = cursorAt(t, cam);
  if (p.x > SIZE + 10 || p.y > SIZE + 10) return;
  const s = 2.5 * (1 - 0.1 * pressAmt(t));
  g.save();
  g.setTransform(s, 0, 0, s, p.x, p.y);
  g.shadowColor = "rgba(0, 0, 0, 0.32)"; g.shadowBlur = 5; g.shadowOffsetY = 2;
  g.lineJoin = "round";
  g.strokeStyle = "#ffffff"; g.lineWidth = 1.7;
  g.stroke(POINTER);
  g.shadowColor = "transparent";
  g.fillStyle = "#000000";
  g.fill(POINTER);
  g.restore();
}

// ------------------------------------------------------------------- seek(t)
function seek(time) {
  const t = ((time % DUR) + DUR) % DUR;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = C.stage;
  ctx.fillRect(0, 0, SIZE, SIZE);
  const cam = camAt(t);
  if (t >= T.ask - 0.02) {
    drawEnding(ctx, t, cam);
  } else {
    if (t < T.split) drawGenerate(ctx, t, cam);
    else if (t < T.tri) drawChat(ctx, t, cam);
    if (t >= T.drop) drawApp(ctx, t, cam);
    if (t >= T.tri) drawPlayButton(ctx, t, cam);
  }
  drawCursor(ctx, t, cam);
}

// --------------------------------------------------------------- démarrage
const ready = (async () => {
  await Promise.all([document.fonts.load(font(500, 34)), document.fonts.load(font(600, 38)),
    document.fonts.load(font(700, 190, "Playfair Display")), document.fonts.load(font(600, 44, "Playfair Display"))]);
  layoutBubbles();
  seek(0);
})();
Object.assign(window, { seek, ready, DUR, FPS, T, BEAT });

if (new URLSearchParams(location.search).has("render")) document.body.classList.add("render");
else ready.then(() => {
  // Aperçu : un lecteur qui ne fait qu'appeler seek(t).
  const play = document.getElementById("play"), scrub = document.getElementById("scrub"), out = document.getElementById("clock");
  let playing = false, t0 = 0, base = 0;
  const show = (t) => { seek(t); scrub.value = t; out.value = `${t.toFixed(2).replace(".", ",")} s`; };
  const loop = (now) => { if (!playing) return; show((base + (now - t0) / 1000) % DUR); requestAnimationFrame(loop); };
  play.onclick = () => {
    playing = !playing; play.textContent = playing ? "Pause" : "Lecture";
    if (playing) { base = +scrub.value; t0 = performance.now(); requestAnimationFrame(loop); }
  };
  scrub.oninput = () => { playing = false; play.textContent = "Lecture"; show(+scrub.value); };
});
</script>
