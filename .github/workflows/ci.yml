name: CI/CD - PR Validation

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # `npm ci` comme dans les quatre autres workflows : la PR est validée
      # avec exactement l'arbre de dépendances du lockfile qui partira en prod
      # (`npm install` pouvait le réécrire en silence).
      - name: Install dependencies
        run: npm ci

      - name: Run Verification
        run: npm run verify

      # Pas `npm run build` : il referait le type-check que verify vient
      # d'exécuter. On ne garde que la compilation et le prerender SEO.
      - name: Build project
        run: npm run build-only && npm run prerender

      # Les Cloud Functions n'étaient compilées qu'au déploiement (predeploy de
      # firebase.json), après la mise en ligne du site : une erreur TypeScript
      # dans functions/src n'apparaissait qu'au moment de la release.
      - name: Build Cloud Functions
        run: npm ci --prefix functions && npm run build --prefix functions

  # Suite de bout en bout (Playwright), en parallèle de build-and-test : elle
  # n'a pas besoin de son build, elle lance son propre serveur Vite
  # (playwright.config.ts) et ses propres émulateurs (scripts/e2e.mjs). Ce
  # qu'elle vérifie est décrit dans docs/tests.md.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Les émulateurs Firestore et Auth tournent sur la JVM (21 au minimum).
      # ubuntu-latest embarque déjà un Temurin 21, on le fixe ici pour que le
      # job ne dépende pas de ce que l'image fournit par défaut.
      - name: Use JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # Comme dans deploy.yml : le CLI firebase n'est pas une dépendance du
      # projet, et scripts/e2e.mjs s'en sert pour démarrer des émulateurs
      # vides le temps de la suite (`emulators:exec --only auth,firestore`).
      # Sans lui, les tests du projet `firebase` seraient ignorés ; en CI,
      # scripts/e2e.mjs refuse ce repli et sort en erreur, pour qu'un job vert
      # veuille toujours dire que la suite entière a tourné.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      # À l'échec seulement : le rapport HTML et les traces et captures des
      # tests rouges, pour comprendre sans rejouer la suite en local.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
