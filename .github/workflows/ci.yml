name: CI/CD - PR Validation

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # `npm ci` comme dans les quatre autres workflows : la PR est validée
      # avec exactement l'arbre de dépendances du lockfile qui partira en prod
      # (`npm install` pouvait le réécrire en silence).
      - name: Install dependencies
        run: npm ci

      - name: Run Verification
        run: npm run verify

      # Pas `npm run build` : il referait le type-check que verify vient
      # d'exécuter. On ne garde que la compilation et le prerender SEO.
      - name: Build project
        run: npm run build-only && npm run prerender

      # Les Cloud Functions n'étaient compilées qu'au déploiement (predeploy de
      # firebase.json), après la mise en ligne du site : une erreur TypeScript
      # dans functions/src n'apparaissait qu'au moment de la release.
      - name: Build Cloud Functions
        run: npm ci --prefix functions && npm run build --prefix functions
