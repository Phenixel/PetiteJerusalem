name: Deploy iOS

# Publie l'app iOS sur TestFlight / l'App Store à chaque tag de version, en
# parallèle de deploy-android.yml et deploy.yml : un tag vX.Y.Z met en prod le
# site, l'app Android et l'app iOS. Le dossier ios/ étant git-ignoré, il est
# régénéré ici de zéro : `cap add ios` + scripts/setup-ios.mjs reproduisent
# exactement le projet natif local (Info.plist, entitlements, manifeste de
# confidentialité, AppDelegate, icônes, schéma Xcode…).
#
# Le build est signé « dans le nuage » : aucun certificat ni profil de
# provisionnement n'est stocké dans le repo. scripts/ios-signing.mjs en
# fabrique un jeu éphémère avec la clé d'API App Store Connect au début du
# run et le détruit à la fin ; la même clé sert à l'envoi de l'IPA et à la
# synchronisation de la fiche.
#
# La signature est MANUELLE, pas automatique : `xcodebuild archive` en mode
# automatique réclame un profil de *développement*, lequel exige au moins un
# appareil enregistré dans l'équipe, ce compte individuel n'en a aucun. Un
# profil « App Store » n'en demande pas. Détails dans scripts/ios-signing.mjs.
#
# Le binaire part sur TestFlight, puis le job `submit` (Linux) attend la fin
# du traitement Apple et soumet la version à l'examen via l'API
# (scripts/asc-submit.mjs), débrayable avec la variable de repo
# IOS_AUTO_SUBMIT=false. La mise en vente, elle, reste un geste manuel dans
# App Store Connect (releaseType MANUAL), voir docs/ios-release-plan.md.
#
# Secrets requis (voir docs/ios-ci-cd.md pour les créer) :
#   ASC_KEY_ID                identifiant de la clé d'API App Store Connect
#   ASC_ISSUER_ID             identifiant de l'émetteur (une seule par compte)
#   ASC_PRIVATE_KEY           contenu du fichier AuthKey_XXXXXXXXXX.p8
#   IOS_DEVELOPMENT_TEAM      Team ID Apple (10 caractères)
#   GOOGLE_SERVICE_INFO_PLIST contenu de GoogleService-Info.plist (config Firebase iOS)

on:
  push:
    tags:
      - "v*"
  # Lancement manuel (test du workflow, re-publication) : reprend le dernier
  # tag vX.Y.Z atteignable depuis la branche choisie.
  workflow_dispatch:
    inputs:
      debug_signing:
        description: >-
          Debug signature : saute le build web et s'arrête après une tentative
          d'archive avec logs de provisioning verbeux (filtrés).
        type: boolean
        default: false

# Les runners macOS consomment les minutes 10× plus vite que Linux : un run
# à la fois, et un plafond de temps pour ne pas partir à la dérive.
concurrency:
  group: deploy-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    # macos-26 fournit Xcode 26, exigé à la fois par Capacitor 8 et par l'App
    # Store depuis le 28 avril 2026 (SDK iOS 26 minimum).
    runs-on: macos-26
    timeout-minutes: 45
    # Consommées par le job `submit` : la version et le numéro de build sont
    # dérivés du tag une seule fois, ici.
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      build_number: ${{ steps.version.outputs.build }}
    env:
      # Xcode épinglé en 26.2 (17C52) : le 26.6 par défaut de l'image échoue
      # sur « Authentication failed: bearer token » pendant la signature
      # automatique, avec des identifiants pourtant valides (la sonde ASC
      # passe, le PEM est canonique, la clé est dans tous les emplacements
      # standard). 26.2 est la version validée en local sur le même projet.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # Historique complet : `git describe` doit retrouver le dernier tag
          # lors d'un lancement manuel.
          fetch-depth: 0

      - name: Vérifier les secrets requis
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          missing=()
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY IOS_DEVELOPMENT_TEAM GOOGLE_SERVICE_INFO_PLIST; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Secrets GitHub manquants : ${missing[*]}, voir docs/ios-ci-cd.md"
            exit 1
          fi

      # Les identifiants collés dans l'interface GitHub embarquent facilement
      # un blanc ou un retour à la ligne final. Nos scripts Node les .trim()ent,
      # mais xcodebuild et altool les reçoivent BRUTS : un kid « XXX\n » dans
      # le JWT suffit à produire « Authentication failed: bearer token » avec
      # une clé pourtant parfaitement valide. Les valeurs nettoyées sont
      # exposées à tout le job via GITHUB_ENV ; les étapes suivantes ne
      # redéclarent PAS ces variables depuis les secrets.
      - name: Normaliser les identifiants ASC
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID IOS_DEVELOPMENT_TEAM; do
            cleaned="$(printf '%s' "${!name}" | tr -d '[:space:]')"
            if [ "${!name}" != "$cleaned" ]; then
              echo "::warning::$name contenait des blancs ou un retour à la ligne, valeur nettoyée pour ce run, corriger le secret."
            fi
            printf '%s=%s\n' "$name" "$cleaned" >> "$GITHUB_ENV"
          done

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Vérifier la version de Xcode
        run: |
          xcodebuild -version
          major="$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')"
          if [ "$major" -lt 26 ]; then
            echo "::error::Xcode $major détecté, Capacitor 8 et l'App Store exigent Xcode 26+"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # Échec rapide si un texte de la fiche dépasse les limites App Store
      # (nom ≤ 30, sous-titre ≤ 30, mots-clés ≤ 100, description ≤ 4000).
      - name: Vérifier les textes de la fiche App Store
        run: node scripts/appstore-listing.mjs --check

      # Échec en deux secondes si les secrets ASC sont incohérents (mauvaise
      # clé .p8, Key ID/Issuer ID erronés, clé révoquée) : xcodebuild ne le
      # dirait qu'après un quart d'heure, d'un « bearer token » cryptique.
      - name: Vérifier l'accès App Store Connect
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: node scripts/asc-auth-check.mjs

      - name: Déterminer la version (tag vX.Y.Z)
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git describe --tags --abbrev=0)"
            VERSION="${VERSION#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide : « $VERSION » (attendu X.Y.Z)"
            exit 1
          fi
          IFS=. read -r MAJ MIN PAT <<< "$VERSION"
          # Même dérivation que le versionCode Android : v3.6.4 -> 3060400.
          # App Store Connect refuse un CFBundleVersion déjà utilisé, donc
          # re-publier exige un nouveau tag (patch +1).
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$((MAJ * 1000000 + MIN * 10000 + PAT * 100))" >> "$GITHUB_OUTPUT"

      - name: Scaffolder le projet natif
        run: npx cap add ios

      - name: Restaurer GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > GoogleService-Info.plist

      # Certificat de distribution + profil « App Store » éphémères, créés via
      # l'API et installés dans un trousseau temporaire. Expose
      # IOS_PROVISIONING_PROFILE et IOS_CODE_SIGN_IDENTITY au reste du job
      # que l'étape suivante inscrit dans la cible App du projet Xcode.
      - name: Créer le certificat et le profil de distribution
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: node scripts/ios-signing.mjs --setup

      # Info.plist, entitlements, PrivacyInfo.xcprivacy, AppDelegate, icônes,
      # schéma Xcode, bundle id, équipe, versions et réglages de signature
      # (le même script qu'en local, cf. l'en-tête de scripts/setup-ios.mjs).
      - name: Appliquer les ajustements natifs
        env:
          IOS_MARKETING_VERSION: ${{ steps.version.outputs.name }}
          IOS_BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: node scripts/setup-ios.mjs

      # Build web (type-check + vite + prerender), prune du bundle natif,
      # puis cap sync copie dist/ et les plugins SPM dans le projet iOS.
      # En debug signature, inutile : l'échec étudié précède les phases de build.
      - name: Build web + sync Capacitor
        if: ${{ !inputs.debug_signing }}
        run: npm run app:build

      # xcodebuild et altool lisent la clé d'API dans ce dossier conventionnel.
      - name: Installer la clé d'API App Store Connect
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          # Le secret peut avoir été collé en une ligne avec des « \n »
          # littéraux (c'est le format que tolère aussi appstore-listing.mjs) :
          # %b les convertit en vrais sauts de ligne et laisse intact un PEM
          # multi-ligne, la base64 PEM ne contenant jamais d'antislash.
          printf '%b' "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_${ASC_KEY_ID}.raw
          # Xcode parse la clé avec CryptoKit, strict sur la forme du PEM
          # (CRLF, BOM, blancs résiduels → « Authentication failed: bearer
          # token » générique) là où openssl, Node et l'API ASC tolèrent
          # tout : la clé est réécrite en PEM canonique, et le run échoue
          # ici, en secondes et lisiblement, si elle n'est pas valide.
          if ! openssl pkey -in ~/private_keys/AuthKey_${ASC_KEY_ID}.raw \
              -out ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 2>/dev/null; then
            echo "::error::ASC_PRIVATE_KEY n'est pas un PEM valide, recoller le contenu exact du fichier AuthKey_${ASC_KEY_ID}.p8 (gh secret set ASC_PRIVATE_KEY < AuthKey_${ASC_KEY_ID}.p8)"
            exit 1
          fi
          rm ~/private_keys/AuthKey_${ASC_KEY_ID}.raw
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          # Toutes les phases d'Xcode n'honorent pas -authenticationKeyPath :
          # certaines ne regardent que les emplacements standard (./private_keys,
          # ~/private_keys, ~/.private_keys, ~/.appstoreconnect/private_keys).
          # La clé est donc posée partout où elle peut être cherchée.
          mkdir -p ~/.appstoreconnect/private_keys ./private_keys
          cp ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 ~/.appstoreconnect/private_keys/
          cp ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 ./private_keys/

      # Aucun réglage de signature en ligne de commande : ils s'appliqueraient
      # à TOUS les targets, paquets SPM compris, qui les refusent (« has
      # conflicting provisioning settings »). Tout est dans la cible App du
      # pbxproj, posé par setup-ios.mjs.
      # En mode debug, xcodebuild tourne avec les journaux de provisioning
      # verbeux, capturés dans un fichier et REFILTRÉS avant affichage : le
      # repo est public, ces journaux peuvent contenir des jetons éphémères.
      - name: Archiver l'app (debug signature)
        if: ${{ inputs.debug_signing }}
        run: |
          defaults write com.apple.dt.Xcode DVTProvisioningLogLevel 3
          defaults write com.apple.dt.Xcode IDEProvisioningLogLevel 3
          security find-identity -v -p codesigning "$IOS_SIGNING_KEYCHAIN"
          set +e
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" > "$RUNNER_TEMP/archive-debug.log" 2>&1
          echo "===== journaux de provisioning (filtrés) ====="
          grep -viE "authorization|bearer ey|x-apple|token[\"':= ]" "$RUNNER_TEMP/archive-debug.log" \
            | grep -iE "provision|sign|auth|team|profile|certificate|error|fail|http|status|register" \
            | head -200
          exit 1

      - name: Archiver l'app
        if: ${{ !inputs.debug_signing }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive"

      - name: Exporter l'IPA
        run: |
          # « app-store-connect » remplace « app-store » depuis Xcode 15.3.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$IOS_DEVELOPMENT_TEAM</string>
            <!-- Manuel comme l'archive : le certificat et le profil de ce run
                 sont déjà installés, Apple n'a rien à créer de plus. -->
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>$IOS_CODE_SIGN_IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>fr.petitejerusalem.app</key>
              <string>$IOS_PROVISIONING_PROFILE</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
            <!-- Sinon Xcode réécrit le numéro de build et le tag ne fait plus foi. -->
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -lh "$RUNNER_TEMP/export"

      # L'IPA signé reste téléchargeable 90 jours depuis l'onglet Actions,
      # même si l'envoi à Apple échoue.
      - name: Archiver l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ios-${{ steps.version.outputs.name }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      # Le build arrive dans TestFlight après quelques minutes de traitement
      # côté Apple ; la soumission à l'examen est reprise par le job `submit`
      # une fois ce traitement terminé.
      #
      # `-t`/`-f` plutôt que `--type`/`--file` : l'altool de Xcode 26 est un
      # binaire réécrit qui ne documente plus les formes longues.
      # Le code de sortie n'est pas fiable (altool a déjà rendu 0 après un
      # « UPLOAD FAILED »), d'où la relecture explicite de la sortie.
      - name: Envoyer sur TestFlight
        run: |
          set -o pipefail
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool.log"
          if grep -qiE "UPLOAD FAILED|ERROR ITMS" "$RUNNER_TEMP/altool.log"; then
            echo "::error::altool a signalé un échec d'envoi, voir le journal ci-dessus"
            exit 1
          fi

      # Fiche App Store (nom, sous-titre, description, mots-clés, nouveautés)
      # synchronisée depuis store-assets/metadata/ios/. Les « Nouveautés »
      # viennent du corps de la release GitHub du tag (sinon phrase par
      # défaut), même logique que deploy-android.yml. Non bloquant : la
      # version cible n'existe dans App Store Connect qu'une fois créée à la
      # main, et le binaire est déjà envoyé à ce stade.
      # Non bloquant, mais PAS silencieux : `continue-on-error` affichait
      # l'étape en vert et l'échec ne se voyait qu'en dépliant le journal.
      - name: Mettre à jour la fiche App Store
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v${{ steps.version.outputs.name }}" \
            --jq '.body // ""' > release-body.md || rm -f release-body.md
          if ! node scripts/appstore-listing.mjs --version "${{ steps.version.outputs.name }}" \
              --release-notes release-body.md; then
            echo "::warning::Fiche App Store non synchronisée (voir le journal), le binaire, lui, est bien parti ; les textes se corrigent à la main dans App Store Connect."
          fi

      # Le profil de ce run est supprimé, même si le build a échoué. Le
      # CERTIFICAT, LUI, EST CONSERVÉ : il l'était autrefois révoqué ici, en
      # pariant qu'Apple re-signe tout ce qui passe par TestFlight et l'App
      # Store. C'est faux à l'examen, où Apple re-valide la signature d'origine.
      # Le build 3.7.3 (3070300) est passé par TestFlight le 17 août 2026 puis a
      # été rejeté à sa mise en file d'examen, « ITMS-90035: Invalid
      # Signature », son certificat ayant été révoqué juste après l'envoi.
      # Le quota est de trois certificats de distribution : si --setup le
      # heurte, il affiche la liste et leur expiration. N'en révoquer un qu'une
      # fois certain qu'aucun build signé avec lui n'est en examen ni en vente.
      - name: Supprimer le profil du run
        if: always()
        continue-on-error: true
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: node scripts/ios-signing.mjs --cleanup

  # La soumission à l'examen ne peut partir qu'une fois le binaire traité par
  # Apple (15 à 40 minutes) : poller depuis le job macOS gaspillerait des
  # minutes facturées 10× plus cher, donc ce job Linux prend le relais. Il
  # attend le build, l'attache à la version du tag (créée par l'étape « fiche »
  # du job macOS) et la soumet (scripts/asc-submit.mjs, node pur, aucun npm ci).
  # La mise en vente reste un geste manuel dans App Store Connect.
  # Débrayable sans toucher au code : variable de repo IOS_AUTO_SUBMIT=false.
  submit:
    needs: ios
    if: ${{ !inputs.debug_signing && vars.IOS_AUTO_SUBMIT != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Attendre le traitement du build et soumettre à l'examen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          node scripts/asc-submit.mjs \
            --version "${{ needs.ios.outputs.version_name }}" \
            --build-number "${{ needs.ios.outputs.build_number }}"
