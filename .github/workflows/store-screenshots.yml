name: Store screenshots

# Captures d'écran des fiches Play Store et App Store, générées UNE fois par
# tag pour les deux stores : mêmes écrans, mêmes données de démo, même rendu
# de l'app (scripts/store-screenshots.mjs), en trois formats (téléphone Play,
# iPhone 6,9", iPad 13"). Le résultat est l'artifact « store-screenshots »
# (le contenu de store-assets/screenshots/), que deploy-android.yml (job
# `listing`) et deploy-ios.yml (job `screenshots`) récupèrent par l'action
# .github/actions/fetch-store-screenshots avant d'envoyer chacun sa part.
#
# Ni émulateur Android ni macOS : Chrome headless rend l'interface de l'app
# native sur un runner Linux, en quelques minutes. Si ce workflow échoue ou
# traîne, les deux fiches retombent sur les captures committées dans
# store-assets/screenshots/ : la release n'attend jamais les captures.
#
# Le lancement manuel régénère les captures du commit choisi, pour contrôle
# visuel (artifact du run, à committer au besoin) sans rien publier. Voir
# store-assets/screenshots/README.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: store-screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-latest
    # Le travail utile tient en cinq minutes : au-delà, quelque chose est
    # bloqué, et les deux deploy attendent ce run avant de se replier.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # Les émulateurs Firebase (compte « Sarah Levy », session Tehilim,
      # chiourim) tournent sur la JVM.
      - name: Use JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Générer les captures (téléphone, iPhone 6,9", iPad 13")
        run: node scripts/store-screenshots.mjs

      # Récupéré par les deux deploy ; téléchargeable 90 jours depuis
      # l'onglet Actions pour contrôle visuel, ou pour le committer.
      - name: Archiver les captures
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: store-assets/screenshots/*/*.jpg
          if-no-files-found: error
