name: Deploy Release

# Déploie le site (hosting), les règles Firestore/Storage, les index et les
# functions. Deux façons de le déclencher :
#   vX.Y.Z      la release complète : ce workflow ET les apps mobiles
#               (deploy-android.yml, deploy-ios.yml partagent le motif v*) ;
#   web-vX.Y.Z  le site seul : correctif front, contenu, SEO… sans release
#               mobile ni release GitHub. Le motif v* ne matche pas web-v*,
#               les workflows mobiles ne se lancent donc pas.
on:
  push:
    tags:
      - "v*"
      - "web-v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app (type-check, build, SEO prerender)
        # Les deux valeurs ci-dessous nourrissent les fichiers /.well-known qui
        # font qu'un lien du site ouvre l'app installée (docs/app-links.md).
        # Elles sont publiques une fois servies ; absentes, le build passe et
        # les liens restent simplement dans le navigateur.
        env:
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          ANDROID_APP_LINK_SHA256: ${{ secrets.ANDROID_APP_LINK_SHA256 }}
        run: npm run build

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Hosting and functions are deployed in SEPARATE steps. They are
      # independent: a functions failure must never block the hosting release
      # (the previous combined "--only hosting,functions" let a transient 409 on
      # a function abort the deploy before hosting was ever released).
      - name: Deploy hosting
        run: |
          set +e
          out=$(firebase deploy --only hosting --project petite-jerusalem-dev --non-interactive 2>&1)
          code=$?
          echo "$out"
          # firebase-tools occasionally exits 1 on the final release with
          # "is the current active version" even though the content is live.
          # Swallow ONLY that exact benign case; ANY other error fails the job.
          # The verification step below still proves the new bundle is served.
          if [ "$code" -ne 0 ] && ! echo "$out" | grep -q "is the current active version"; then
            exit "$code"
          fi

      # Proves the release was actually ACTIVATED, not just uploaded. Compares
      # the entry bundle hash just built (dist/index.html) with the one served
      # in prod. Guards against the "green but not live" false positive.
      - name: Verify hosting release is live
        run: |
          expected=$(grep -oE 'index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          if [ -z "$expected" ]; then
            echo "::error::Could not determine expected bundle hash from dist/index.html."
            exit 1
          fi
          echo "Expected entry bundle: $expected"
          for i in $(seq 1 12); do
            served=$(curl -fsS "https://petite-jerusalem-dev.web.app/?cb=$(date +%s)" 2>/dev/null | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1)
            echo "Attempt $i, served: ${served:-<none>}"
            if [ "$served" = "$expected" ]; then
              echo "✓ New hosting version is live in production."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Hosting release never became active (served=${served:-<none>}, expected=$expected)."
          exit 1

      # Le site vient d'être vérifié en prod : on prévient IndexNow (Bing,
      # Yandex…) que les URLs ont changé, au lieu d'attendre leur prochain
      # crawl. Google ne l'utilise pas (sitemap dans la Search Console). Non
      # bloquant : un refus IndexNow ne doit pas faire échouer un déploiement
      # dont le site est déjà en ligne.
      - name: Ping IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs

      # Security rules were the one thing this workflow never shipped: every
      # rules change (moderation, #142) had to be pushed by hand, and a rule
      # left behind silently breaks reads and writes the new front-end expects.
      # Deployed AFTER hosting for the same reason as functions, a rules
      # failure must not hold the site release hostage. Indexes ship with them:
      # they are declared in the same firebase.json and a missing index fails
      # queries exactly like a missing rule.
      - name: Deploy Firestore rules and indexes
        run: |
          firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project petite-jerusalem-dev --non-interactive

      # Déployé à part de Firestore : firebase-tools commence par lire le bucket
      # par défaut, et tant que ce droit manquait, le 403 emportait aussi les
      # règles Firestore de la même commande. Les droits nécessaires au service
      # account sont documentés dans docs/firebase-ci-cd.md.
      - name: Deploy Storage rules
        run: |
          firebase deploy --only storage \
            --project petite-jerusalem-dev --non-interactive

      # Deployed AFTER hosting so a transient functions error can never block the
      # front release. Retries once to absorb a transient 409 "unable to queue
      # the operation" (concurrent operation on the function).
      - name: Deploy functions
        run: |
          set +e
          for attempt in 1 2 3; do
            out=$(firebase deploy --only functions --project petite-jerusalem-dev --non-interactive 2>&1)
            code=$?
            echo "$out"
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            echo "Functions deploy attempt $attempt failed (exit $code); retrying in 30s…"
            sleep 30
          done
          echo "::error::Functions deploy failed after 3 attempts."
          exit "$code"
