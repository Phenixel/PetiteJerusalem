name: Deploy Android

# Publie l'app Android sur le Play Store à chaque tag de version (le même
# déclencheur que le déploiement web dans deploy.yml : un tag vX.Y.Z met en
# prod le site ET l'app). Le dossier android/ étant git-ignoré, il est
# régénéré ici de zéro : `cap add android` + scripts/setup-android.mjs
# reproduisent exactement le projet natif local (icônes, barre système,
# signature, MainActivity…).
#
# La release part sur la piste **production** en statut « completed » : dès
# que la review Google est passée, la version est disponible pour tout le
# monde, sans aucun geste dans la Play Console. (L'ancienne variable de repo
# ANDROID_PLAY_TRACK, utile tant que l'app était en test fermé, n'est plus
# lue : la supprimer si elle traîne encore dans Settings → Variables.)
#
# Trois jobs :
#   screenshots  régénère les captures d'écran de la fiche sur un émulateur
#                Android (npm run store:screenshots, données de démo fixes)
#                et les publie en artifact ; non bloquant pour la release ;
#   android      construit l'AAB signé, l'envoie sur la piste production avec
#                les notes de version, crée la release GitHub ;
#   listing      synchronise la fiche Play Store (titre, descriptions,
#                captures) avec les captures régénérées, ou celles du repo si
#                l'émulateur a flanché.
#
# Le lancement manuel accepte « screenshots_only » : le premier job seul, pour
# vérifier les captures (artifact du run) sans rien publier.
#
# Les notes de version (« Nouveautés ») reprennent le texte de la release
# GitHub du tag si elle existe (créer la release depuis l'interface GitHub
# avec son texte publie donc ces notes sur le Play Store), sinon la phrase
# par défaut de scripts/release-notes.mjs.
#
# Secrets requis (voir docs/android-ci-cd.md pour les créer) :
#   ANDROID_KEYSTORE_BASE64   keystore de release encodé en base64
#   ANDROID_KEYSTORE_PASSWORD mot de passe du keystore
#   ANDROID_KEY_ALIAS         alias de la clé (petite-jerusalem)
#   ANDROID_KEY_PASSWORD      mot de passe de la clé
#   GOOGLE_SERVICES_JSON      contenu de google-services.json (config Firebase)
#   PLAY_SERVICE_ACCOUNT_JSON compte de service lié au Play Console

on:
  push:
    tags:
      - "v*"
  # Lancement manuel (test du workflow, re-publication) : reprend le dernier
  # tag vX.Y.Z atteignable depuis la branche choisie.
  workflow_dispatch:
    inputs:
      screenshots_only:
        description: >-
          Régénérer seulement les captures d'écran (artifact du run) : ni AAB,
          ni release, ni fiche Play Store touchée.
        type: boolean
        default: false

jobs:
  # Captures d'écran de la fiche : mêmes écrans, mêmes données de démo et même
  # rendu (app native, barre de statut et barre d'onglets) qu'en local, sur un
  # émulateur Android accéléré par KVM. Si ce job échoue, la release n'attend
  # pas : le job `listing` retombe sur les captures committées dans le repo.
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # Gradle (build debug de l'app) et les émulateurs Firebase veulent le
      # JDK 21, comme dans le job android.
      - name: Use JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # /dev/kvm existe sur les runners Linux mais est réservé à root : sans
      # cette règle udev, l'émulateur tourne sans accélération matérielle et
      # le boot dépasse le délai du script.
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: npm ci

      # Les émulateurs Firebase fournissent Auth et Firestore aux données de
      # démo (compte « Sarah Levy », session Tehilim, chiourim).
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Restaurer google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json

      - name: Scaffolder le projet natif
        run: npx cap add android

      # Manifest, icônes/splash, barre système, MainActivity… (le même script
      # qu'en local). Pas de clé de signature : le script de captures installe
      # un build debug.
      - name: Appliquer les ajustements natifs
        run: node scripts/setup-android.mjs

      # Le build d'abord, le sync ensuite, et les deux sont nécessaires :
      # `cap add` plus haut n'a pas pu terminer le sien, faute de dist/ à ce
      # moment-là (« sync could not run--missing dist directory »), or c'est ce
      # sync qui écrit android/capacitor.settings.gradle, le fichier où Gradle
      # lit la liste des plugins. Sans lui, `gradlew :app:installDebug` s'arrête sur
      # « Could not read script … as it does not exist ». Le job de release ne
      # connaît pas ce défaut : son `npm run app:build` fait le sync.
      # Ni type-check ni prerender SEO ici : l'app capturée vient du serveur
      # Vite du script (CAP_SERVER_URL), pas de ce bundle.
      - name: Build web + sync Capacitor
        run: |
          npm run build-only
          npx cap sync android

      # Le build debug de l'app télécharge AGP et ses dépendances : sans ce
      # cache, à chaque run. android/ est régénéré à chaque fois, mais ce
      # dépôt-là ne dépend que des versions de Capacitor, figées par le
      # lockfile.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-screenshots-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-screenshots-

      # L'émulateur est ouvert par l'action, pas par le script : démarrer un
      # émulateur sur un runner sans écran demande plus que trois options de
      # ligne de commande (paquets SDK, AVD, attente du boot, reprise après un
      # démarrage manqué), et le lancement maison du script y mourait sans un
      # mot (v3.8.1 : « device emulator-5584 not found » au bout de huit
      # minutes). Ses options par défaut sont celles qui valent ici (-no-window,
      # -gpu swiftshader_indirect, -no-snapshot, -noaudio, -no-boot-anim), et
      # elle retombe d'elle-même sur l'émulation logicielle si le runner ne
      # donne pas KVM, là où un émulateur x86_64 lancé à la main refuse de
      # démarrer. ANDROID_SERIAL dit au script de se brancher sur cet
      # émulateur-là plutôt que d'en lancer un second.
      # Le travail utile tient en une dizaine de minutes (l'émulateur démarre
      # en 40 secondes) : au-delà de vingt, quelque chose est bloqué, et il
      # vaut mieux le voir tout de suite que d'attendre le plafond du job.
      - name: Générer les captures d'écran
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Le port ci-dessous, sous la forme qu'attend adb.
          ANDROID_SERIAL: emulator-5554
        with:
          # Mêmes API, cible et profil que l'AVD du dev local (1080×1920), voir
          # l'en-tête de scripts/store-screenshots.mjs.
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: pj-store
          # Le défaut de l'action, écrit ici parce qu'ANDROID_SERIAL en dépend.
          emulator-port: 5554
          disable-animations: true
          script: node scripts/store-screenshots.mjs

      # Récupérées par le job `listing`, et téléchargeables 90 jours depuis
      # l'onglet Actions pour contrôle visuel (ou pour les committer).
      - name: Archiver les captures
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots-android
          path: store-assets/metadata/android/fr-FR/images/phoneScreenshots/
          if-no-files-found: error

  android:
    # Le lancement manuel « captures seules » s'arrête au job ci-dessus : rien
    # n'est publié, et `listing` ne suit pas non plus (il exige que ce job ait
    # réussi, or il est sauté).
    if: ${{ !inputs.screenshots_only }}
    runs-on: ubuntu-latest
    permissions:
      # write : création de la release GitHub (AAB + notes de version) sur tag.
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # Historique complet : `git describe` doit retrouver le dernier tag
          # lors d'un lancement manuel.
          fetch-depth: 0

      - name: Vérifier les secrets requis
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_SERVICES_JSON PLAY_SERVICE_ACCOUNT_JSON; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Secrets GitHub manquants : ${missing[*]}, voir docs/android-ci-cd.md"
            exit 1
          fi

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # Gradle/AGP de Capacitor 8 requièrent le JDK 21 (comme en local).
      # Pas de `cache: gradle` : android/ est git-ignoré et n'est régénéré
      - name: Use JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # Échec rapide si un texte de la fiche dépasse les limites Play Console
      # (titre ≤ 30, description courte ≤ 80, longue ≤ 4000, notes ≤ 500).
      # La synchronisation elle-même est faite par le job `listing`.
      - name: Vérifier les textes de la fiche Play Store
        run: node scripts/play-listing.mjs --check

      - name: Déterminer la version (tag vX.Y.Z)
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git describe --tags --abbrev=0)"
            VERSION="${VERSION#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide : « $VERSION » (attendu X.Y.Z)"
            exit 1
          fi
          IFS=. read -r MAJ MIN PAT <<< "$VERSION"
          # versionCode strictement croissant, dérivé du semver (le Play Store
          # refuse tout code déjà utilisé) : v3.0.1 -> 3000100. Pour re-publier
          # un build, il faut donc un nouveau tag (patch +1).
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$((MAJ * 1000000 + MIN * 10000 + PAT * 100))" >> "$GITHUB_OUTPUT"

      - name: Scaffolder le projet natif
        run: npx cap add android

      - name: Restaurer google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json

      # Manifest, icônes/splash, barre système, MainActivity, signingConfigs…
      # (le même script qu'en local, cf. l'en-tête de scripts/setup-android.mjs)
      - name: Appliquer les ajustements natifs
        run: node scripts/setup-android.mjs

      - name: Restaurer la clé de signature release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          # storeFile est résolu relativement à android/app/ par build.gradle.
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Aligner versionName/versionCode sur le tag
        run: |
          for module in app wear; do
            sed -i -E "s/versionName \"[^\"]+\"/versionName \"${{ steps.version.outputs.name }}\"/" \
              "android/$module/build.gradle"
          done
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ steps.version.outputs.code }}/" android/app/build.gradle
          # L'app de montre est un artefact distinct de la même fiche Play :
          # son versionCode doit différer de celui du téléphone, et le pas de
          # 100 du semver laisse toute la place voulue (docs/app-watch.md).
          sed -i -E "s/versionCode [0-9]+/versionCode $(( ${{ steps.version.outputs.code }} + 1 ))/" android/wear/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle android/wear/build.gradle

      # Build web (type-check + vite + prerender), prune du bundle natif,
      # puis cap sync copie dist/ dans le projet Android.
      - name: Build web + sync Capacitor
        run: npm run app:build

      # Les deux artefacts : celui du téléphone et celui de la montre. Ils
      # partent dans la MÊME release Play Store, qui choisit lequel envoyer à
      # quel appareil (docs/app-watch.md).
      - name: Build AAB release (téléphone + montre)
        run: cd android && ./gradlew :app:bundleRelease :wear:bundleRelease --no-daemon

      # L'AAB signé reste téléchargeable 90 jours depuis l'onglet Actions,
      # même si la publication Play échoue.
      - name: Archiver les AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.name }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/wear/build/outputs/bundle/release/wear-release.aab
          if-no-files-found: error

      # Notes de version (« Nouveautés ») : le texte de la release GitHub du
      # tag si elle existe (rédigé à la main en créant la release), sinon la
      # phrase par défaut, voir scripts/prepare-whatsnew.mjs.
      - name: Préparer les notes de version
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v${{ steps.version.outputs.name }}" \
            --jq '.body // ""' > release-body.md || rm -f release-body.md
          node scripts/prepare-whatsnew.mjs release-body.md
          ls whatsnew

      # Piste production, statut « completed » : dès la fin de la review
      # Google, la version part chez tout le monde, sans geste dans la Play
      # Console.
      - name: Publier sur le Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fr.petitejerusalem.app
          releaseFiles: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/wear/build/outputs/bundle/release/wear-release.aab
          track: production
          status: completed
          whatsNewDirectory: whatsnew

      # Release GitHub sur le tag : AAB signé + notes de version, pour
      # retrouver chaque build publié sans passer par l'onglet Actions. Si la
      # release existe déjà (créée à la main avec son texte), l'AAB y est
      # simplement attaché : sans `body`, l'action conserve le texte d'origine.
      # Sinon, le corps reprend whatsnew-fr-FR (la phrase par défaut).
      - name: Créer la release GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.name }}
          body_path: ${{ steps.notes.outputs.has_release_body != 'true' && 'whatsnew/whatsnew-fr-FR' || '' }}
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/wear/build/outputs/bundle/release/wear-release.aab

  # Fiche Play Store (titre, descriptions, captures d'écran) synchronisée
  # depuis store-assets/metadata/android/, voir scripts/play-listing.mjs. Les
  # captures sont celles régénérées par le job `screenshots` quand il a
  # abouti, sinon celles committées dans le repo : la fiche est toujours
  # synchronisée, la fraîcheur des captures est le seul best-effort.
  listing:
    needs: [android, screenshots]
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Le jeu régénéré remplace ENTIÈREMENT celui du repo : un fichier
      # committé qui resterait à côté partirait en doublon sur la fiche.
      - name: Vider les captures committées
        if: needs.screenshots.result == 'success'
        run: rm -f store-assets/metadata/android/fr-FR/images/phoneScreenshots/*.png

      - name: Récupérer les captures régénérées
        if: needs.screenshots.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: store-screenshots-android
          path: store-assets/metadata/android/fr-FR/images/phoneScreenshots/

      - name: Mettre à jour la fiche Play Store
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/play-listing.mjs
